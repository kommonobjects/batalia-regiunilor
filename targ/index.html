<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Târgul">
<meta name="theme-color" content="#070a16">
<title>Târgul de Crăciun · Craiova</title>
<style>
html,body{margin:0;background:#070a16;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
#c{width:min(calc(100vw - 20px),calc((100vh - 170px)*0.5625));min-width:280px;aspect-ratio:9/16;border-radius:14px;box-shadow:0 10px 40px #000a;background:#0b1024}
body.live #wrap{padding:0;height:100vh;height:100dvh;justify-content:center;background:#070a16}
body.live #c{width:min(100vw,calc(100dvh*0.5625));min-width:0;border-radius:0;box-shadow:none}
body.land #c{aspect-ratio:16/9;width:min(calc(100vw - 20px),calc((100vh - 170px)*1.7778))}
body.land.live #c{width:min(100vw,calc(100dvh*1.7778))}
body.live #ctl{display:none}
#ctl{width:min(100%,720px);display:flex;flex-direction:column;gap:6px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
button,select,input{background:#1b2347;color:#fff;border:1px solid #33407a;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
button:hover{background:#26315f}
button.g{background:#3a2a07;border-color:#8a6510}
#st{opacity:.75}
label{display:flex;gap:4px;align-items:center}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="ytw" style="position:fixed;left:0;bottom:0;width:200px;height:113px;opacity:0.01;pointer-events:none;overflow:hidden"><div id="yt"></div></div>
<div id="ctl">
  <div class="row">
    <span>Simulator:</span>
    <button data-a="chat">💬 Comentariu</button>
    <button data-a="like">❤️ +30 like</button>
    <button data-a="like200">❤️ +200 like</button>
    <button data-a="board">📸 Poza serii</button>
  </div>
  <div class="row">
    <button class="g" data-g="1|Rose">🌹 Felinar</button>
    <button class="g" data-g="5|Finger Heart">🫰 Carusel</button>
    <button class="g" data-g="30|Doughnut">🍩 Glob</button>
    <button class="g" data-g="100|Hand Hearts">🫶 Artificii</button>
    <button class="g" data-g="100|Confetti">🎉 Sania</button>
    <button class="g" data-g="199|Sunglasses">😎 Moș Crăciun</button>
  </div>
  <div class="row">
    <button data-a="live" style="background:#c62828;border-color:#ff5252;font-weight:700">▶️ MOD LIVE</button>
    <label><input type="checkbox" id="demo"> Demo automat (boți)</label>
    <button data-a="music">🎵 Muzică on/off</button>
    <button data-a="reset">🔄 Seară nouă</button>
  </div>
  <div class="row">
    <span>tik.tools:</span>
    <input id="ttUser" placeholder="user TikTok (fără @)" style="width:150px">
    <input id="ttKey" type="password" placeholder="API key" style="width:150px">
    <button data-a="tt">🔌 Salvează + conectează</button>
    <span id="st"></span>
  </div>
</div>
</div>
<script>
(()=>{
const Q=new URLSearchParams(location.search),LIVE=Q.has('live');
const OQ=Q.get('o'),LAND=OQ==='l'||(OQ!=='p'&&innerWidth>innerHeight);
const W=LAND?1920:1080,H=LAND?1080:1920,FF='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
if(LAND)document.body.classList.add('land');
if(!OQ){const mq=matchMedia('(orientation: landscape)');mq.addEventListener&&mq.addEventListener('change',()=>{if(mq.matches!==LAND)location.reload()})}
if(LIVE)document.body.classList.add('live');
/* portrait safe zone: TikTok covers ~0-130 (profile) and ~1280+ (chat) */
const WS=LAND?1080/1920:1,WX=LAND?40:0,PX=LAND?700:30,PW=LAND?1180:1020;

/* ---------- Stages (co-op) ---------- */
const GOALS=(Q.get('goals')||'300,800,1500').split(',').map(Number);
const STG=[{e:'⛸️',n:'Patinoarul'},{e:'🎠',n:'Caruselul'},{e:'🛷',n:'Sania lui Moș Crăciun'},{e:'🎄',n:'Bradul se aprinde'}];
let magic=0,stage=0,night=1,finaleUntil=0,stageT=0;
const ITEMS=[[/\bvin/,'☕',0],[/covrig/,'🥨',1],[/turt/,'🍪',2],[/ciocolat/,'🍫',3]],served=[0,0,0,0],stallFlash=[0,0,0,0],petals=[];
const snowballs=[],users=new Map(),skaters=[],feedL=[],banners=[],pops=[],hearts_=[],lanterns=[],fw=[],flakes=[],globes=[],names=[];
let takeover=null,firstSk=null,king=null,mos=null,sleighFly=null,shakeT=0,snowBoost=0,cabUntil=0,nextCab=performance.now()+120000,nextHint=performance.now()+12000,hintI=0;
const giftCnt=[0,0,0,0,0,0];
for(let i=0;i<160;i++)flakes.push({x:Math.random()*1080,y:100+Math.random()*1800,v:30+Math.random()*60,r:1.5+Math.random()*3});
const COLS=['#e53935','#fdd835','#1e88e5','#43a047','#fb8c00','#ec407a','#8e24aa','#00bcd4','#ff7043','#7cb342'];
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function U(id,nick){let u=users.get(id);if(!u){u={id,nick:nick||id,cc:0,lk:0,lastC:0,likeT:0,pic:'',orn:false,col:COLS[users.size%COLS.length]};users.set(id,u)}if(nick)u.nick=nick;return u}
function feed(t,col){feedL.push({t,col});if(feedL.length>8)feedL.shift()}
function banner(title,sub,col,big){if(banners.length>3)banners.splice(1,1);banners.push({title,sub,col,big,t0:0})}
function short(n,k){n=n||'';return n.length>k?n.slice(0,k-1)+'…':n}
function topBy(k,min){let b=null;users.forEach(u=>{if(u[k]>=min&&(!b||u[k]>b[k]))b=u});return b}

/* ---------- Rink ---------- */
function skate(u){let s=skaters.find(s=>s.u===u);if(!s){s={u,a:Math.random()*6.28,r:.35+Math.random()*.55,sp:(.25+Math.random()*.25)*(Math.random()<.5?-1:1),trick:0,say:'',sayT:0};skaters.push(s);if(skaters.length>28)skaters.shift();if(!firstSk){firstSk=u;banner('⛸️ PRIMUL PE GHEAȚĂ',u.nick,'#90caf9')}}return s}
function sxy(s){return[RK.x+Math.cos(s.a)*RK.rx*s.r,RK.y+Math.sin(s.a)*RK.ry*s.r]}
function addMagic(n){if(finaleUntil)return;magic+=n;while(stage<3&&magic>=GOALS[stage]){stage++;stageT=performance.now();const S=STG[stage];
  sfx('win');burst(80);banner(`${S.e} ${S.n.toUpperCase()}!`,stage===3?'mulțumim tuturor! 🎆':'s-a deschis la târg — mulțumim!','#FCD116',true);feed(`${S.e} ${S.n} s-a deschis!`,'#ffd54f');
  if(stage===3){finaleUntil=performance.now()+20000;cabUntil=performance.now()+14000;for(let k=0;k<14;k++)fw.push({x:120+Math.random()*840,y:220+Math.random()*320,t0:performance.now()+k*500,col:COLS[k%10]})}}}

function onChat(id,nick,text){
  const u=U(id,nick),t=norm(text),now=performance.now(),s=skate(u);u.seen=now;s.leave=0;
  const m=/@([^\s@]+)/.exec(String(text||''));if(m){const q=norm(m[1]);const tg=skaters.find(o=>o!==s&&(norm(o.u.nick).replace(/\s/g,'').startsWith(q)||norm(o.u.id).startsWith(q)));
    if(tg){if(/bulgar/.test(t)){snowballs.push({a:s,b:tg,t0:now});sfx('hit')}else{s.partner=tg;s.pairUntil=now+20000;pop(u,'⛸️💞 '+short(tg.u.nick,10))}}}
  s.say=short(String(text||'').replace(/\s+/g,' ').trim(),22);s.sayT=now;
  if(/\btarg/.test(t)&&now>cabUntil+20000)cabUntil=now+8000;
  for(const [re,e,k] of ITEMS)if(re.test(t)){s.item=e;s.itemT=now;served[k]=(served[k]||0)+1;stallFlash[k]=now;break}
  if(now-u.lastC<2500)return;u.lastC=now;u.cc++;s.trick=now;addMagic(5);sfx('tick');
  const k=topBy('cc',3);if(k&&k!==king){king=k;if(k.cc>=6){feed(`👑 ${k.nick} e Regele patinoarului`,'#ffd54f')}}
}
function onLike(id,nick,n){
  const u=U(id,nick),now=performance.now(),sk=skate(u);u.seen=now;sk.leave=0;u.lk+=n;addMagic(n);
  for(let i=0;i<Math.min(6,n);i++)hearts_.push({x:RK.x+(Math.random()-.5)*600,y:RK.y,vx:(Math.random()-.5)*60,vy:-140-Math.random()*120,l:1,col:u.col,s:20+Math.random()*14});
  if(!u.orn&&u.lk>=100){u.orn=true;names.push(u);if(names.length>12)names.shift();pop(u,'🎄 numele tău e în brad!');feed(`🎄 ${u.nick} și-a agățat numele în brad`,'#81c784')}
  else if(now-u.likeT>8000){u.likeT=now;pop(u,'❤️ x'+n)}
}
function onJoin(id,nick){const u=U(id,nick),now=performance.now();if(u.greeted&&now-u.greeted<600000)return;u.greeted=now;u.seen=now;const s=skate(u);s.leave=0;s.trick=now;s.say='👋 salut!';s.sayT=now;
  if(users.size<400)feed(`👋 ${u.nick} a intrat la târg`,u.col)}
function onSocial(id,nick,kind){const u=U(id,nick),s=skate(u);u.seen=performance.now();if(kind==='follow')u.star=1;banner(kind==='follow'?'⭐ FOLLOW NOU!':'📣 SHARE!',`mulțumim, ${u.nick}!`,'#90caf9');sfx('big')}

/* ---------- Gifts: decor only (never add magic) ---------- */
const GK=[
 {k:'felinar',e:'🌹',l:'Felinar',m:/rose|trandafir/i},
 {k:'carusel',e:'🫰',l:'Carusel',m:/finger|inimioar/i},
 {k:'glob',e:'🍩',l:'Glob în brad',m:/dough|donut|gogoa/i},
 {k:'artificii',e:'🫶',l:'Artificii',m:/hand ?heart|inimi\b/i},
 {k:'sanie',e:'🎉',l:'Sania',m:/confetti/i},
 {k:'mos',e:'😎',l:'Moș Crăciun',m:/sunglass|ochelari/i}];
const giftPic={};try{Object.assign(giftPic,JSON.parse(localStorage.getItem('tg_gpics')||'{}'))}catch(e){}
function gkind(name,unit){for(let i=0;i<GK.length;i++)if(name&&GK[i].m.test(name))return i;return unit>=199?5:unit>=100?3:unit>=30?2:unit>=5?1:0}
function burst(n){for(let i=0;i<n&&hearts_.length<200;i++)hearts_.push({x:Math.random()*1080,y:800+Math.random()*300,vx:(Math.random()-.5)*100,vy:-200-Math.random()*150,l:1,col:COLS[i%10],s:18+Math.random()*16})}
function onGift(id,nick,coins,gname,unit,gpic){
  const u=U(id,nick),now=performance.now(),s=skate(u);s.trick=now;u.seen=now;s.leave=0;
  unit=Math.max(1,Math.round(unit||coins||1));const ki=gkind(gname,unit),K=GK[ki];giftCnt[ki]++;
  if(gpic&&giftPic[K.k]!==gpic){giftPic[K.k]=gpic;try{localStorage.setItem('tg_gpics',JSON.stringify(giftPic))}catch(e){}}
  feed(`${K.e} ${u.nick} · ${K.l}`,u.col);const[x,y]=sxy(s);
  u.gifts=(u.gifts||0)+1;if(!String(id).startsWith('bot_'))say(`Mulțumim, ${u.nick}!`);coins=Math.max(1,Math.round(coins||unit));u.coins=(u.coins||0)+coins;
  u.combo=(now-(u.lastGift||0)<15000)?(u.combo||1)+1:1;u.lastGift=now;if(u.combo>=2)pop(u,'🔥 combo x'+u.combo);
  if(coins>=1000||(u.combo>=5&&coins>=100)){takeover={u,t0:now,coins,label:K.l};sfx('win');shakeT=now+700;for(let k=0;k<10;k++)fw.push({x:120+Math.random()*840,y:220+Math.random()*320,t0:now+k*300,col:COLS[k%10]})}
  else if(coins>=100){for(let k=0;k<4;k++)fw.push({x:150+Math.random()*780,y:240+Math.random()*300,t0:now+k*300,col:COLS[k%10]})}
  if(K.k==='felinar'){u.rose=1;const big=u.combo>=5;for(let k=0;k<(big?160:40);k++)petals.push({x:RK.x+(Math.random()-.5)*(big?1080:700),y:big?100+Math.random()*-400:RK.y-300-Math.random()*200,vx:(Math.random()-.5)*40,vy:80+Math.random()*80,r:Math.random()*6.28,l:1});if(big)banner('🌹 PLOAIE DE TRANDAFIRI',`de la ${u.nick}`,'#e91e63',true);u.scarf='#d50000';if(lanterns.length<30)lanterns.push({u,x,y:y-30,t0:now,dx:(Math.random()-.5)*60});pop(u,'🧣 fular roșu + felinar')}
  else if(K.k==='carusel'){u.rideUntil=now+60000;sfx('big');banner('🎠 A URCAT ÎN CARUSEL',u.nick,u.col)}
  else if(K.k==='glob'){if(!globes.includes(u)){globes.push(u);if(globes.length>5)globes.shift()}sfx('big');banner('🎄 GLOB ÎN BRADUL TÂRGULUI',u.nick,u.col,true)}
  else if(K.k==='artificii'){for(let k=0;k<6;k++)fw.push({x:150+Math.random()*780,y:240+Math.random()*300,t0:now+k*350,col:COLS[k%10]});fw.nick=u.nick;fw.until=now+3500;sfx('win');banner('🎆 ARTIFICII',`de la ${u.nick}`,u.col,true)}
  else if(K.k==='sanie'){sleighFly={u,t0:now};sfx('win');banner('🛷 CONDUCE SANIA MOȘULUI',u.nick,'#e53935',true)}
  else if(K.k==='mos'){mos=u;sleighFly={u,t0:now};shakeT=now+400;sfx('win');banner('🎅 MOȘ CRĂCIUN AL SERII',`${u.nick} · Moșul are fața lui!`,'#e53935',true)}
}
function pop(u,text){if(pops.length>=9)pops.shift();const s=skaters.find(s=>s.u===u);const[x1,y1]=s?sxy(s):[540,1000];pops.push({u,text,col:u.col,x0:100+880*Math.random(),y0:1250,x1,y1:y1-40,t0:performance.now()})}
let voiceQ=[],lastSay=0;function say(t){try{if(!('speechSynthesis' in window)||Q.get('tts')==='0')return;const n=performance.now();if(n-lastSay<2500||speechSynthesis.speaking){if(voiceQ.length<3)voiceQ.push(t);return}lastSay=n;const m=new SpeechSynthesisUtterance(t);m.lang='ro-RO';const v=speechSynthesis.getVoices().find(v=>/^ro/i.test(v.lang));if(v)m.voice=v;m.rate=1;m.volume=1;m.onend=()=>{const nx=voiceQ.shift();if(nx)setTimeout(()=>say(nx),300)};speechSynthesis.speak(m)}catch(e){}}
function newNight(now){night++;magic=0;stage=0;finaleUntil=0;firstSk=null;king=null;names.length=0;globes.length=0;skaters.length=0;giftCnt.fill(0);users.forEach(u=>{u.cc=0;u.lk=0;u.orn=false});
  banner(`🌙 SEARA ${night} LA TÂRG`,'patinoarul e deschis — scrie în chat!','#90caf9',true);feed(`🌙 Seara ${night} a început`,'#ffd54f')}

/* ---------- Helpers ---------- */
const imgs=new Map();
function img(url){if(!url)return null;let i=imgs.get(url);if(!i){i=new Image();i.referrerPolicy='no-referrer';i.src=url;imgs.set(url,i)}return i.complete&&i.naturalWidth?i:null}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function font(sz,w=800){ctx.font=`${w} ${sz}px ${FF}`}
function fit(t,max,sz,w=800){font(sz,w);while(ctx.measureText(t).width>max&&sz>12){sz-=2;font(sz,w)}return sz}
function txt(t,x,y,fill,stroke,lw){if(stroke){ctx.lineWidth=lw||6;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(t,x,y)}ctx.fillStyle=fill;ctx.fillText(t,x,y)}
function avatar(u,x,y,r,col){const c=col||u.col||'#888';ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.closePath();const im=img(u.pic);
  if(im){ctx.clip();ctx.drawImage(im,x-r,y-r,2*r,2*r)}else{const g=ctx.createRadialGradient(x-r*.3,y-r*.3,1,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(.25,c);g.addColorStop(1,shade(c,-.35));ctx.fillStyle=g;ctx.fill();ctx.fillStyle='#fff';font(r*1.05|0,900);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText((u.nick||'?')[0].toUpperCase(),x,y+2)}
  ctx.restore();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.lineWidth=Math.max(2.5,r/9);ctx.strokeStyle='#fff';ctx.stroke()}
function shade(h,p){const n=parseInt(h.slice(1),16),f=v=>Math.max(0,Math.min(255,Math.round(v+(p<0?v:255-v)*p)));return'#'+[(n>>16)&255,(n>>8)&255,n&255].map(f).map(v=>v.toString(16).padStart(2,'0')).join('')}
const BULB=['#ff5252','#ffd740','#69f0ae','#40c4ff','#ff80ab','#fff3c4'];
function riders(){const n=performance.now(),gi=[...users.values()].filter(u=>u.rideUntil>n),fr=[...users.values()].filter(u=>u.lk>0&&!gi.includes(u)).sort((a,b)=>b.lk-a.lk);return gi.concat(fr).slice(0,6)}
function sleighCrew(){return [...users.values()].filter(u=>u.cc+u.lk/20>0).sort((a,b)=>(b.cc+b.lk/20)-(a.cc+a.lk/20)).slice(0,5)}
function bulb(x,y,r,c,on,now,k){if(on){ctx.save();ctx.globalAlpha=.25;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r*2.6,0,7);ctx.fill();ctx.restore()}ctx.fillStyle=on?c:'#3b4a6b';ctx.globalAlpha=on?.75+.25*Math.sin(now/260+k):1;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.globalAlpha=1}

/* ---------- World (1080x1920, UI safe zone 130-1280) ---------- */
const TREE={x:540,top:420,base:780},RK={x:610,y:1050,rx:420,ry:140},CAR={x:165,y:960};
const SKY=[];for(let i=0;i<90;i++)SKY.push([(i*173)%1080,(i*97)%620+20,(i%3)+1]);
const BLD=[];{let x=-20;let k=0;while(x<1100){const w=60+((k*37)%70),h=90+((k*53)%110);BLD.push({x,w,h,roof:k%3,win:k});x+=w-4;k++}}
const SLOT=[];[[0.38,[0]],[0.56,[-.5,.5]],[0.72,[-.66,0,.66]],[0.88,[-.75,-.25,.25,.75]],[0.97,[-.85,-.45,0,.45,.85]]].forEach(([f,xs])=>{const y=TREE.top+(TREE.base-TREE.top)*f,hw=(y-TREE.top)*.62;xs.forEach(a=>SLOT.push([TREE.x+a*hw,y-6]))});
let bgCache=null;
function drawStatic(){const c=document.createElement('canvas');c.width=1080;c.height=1920;const g=c.getContext('2d');const o=ctx;
  const sk=g.createLinearGradient(0,0,0,900);sk.addColorStop(0,'#070b2a');sk.addColorStop(.6,'#1b2a6b');sk.addColorStop(1,'#3a4f9a');g.fillStyle=sk;g.fillRect(0,0,1080,1920);
  /* skyline */
  BLD.forEach(b=>{const y=780-b.h;g.fillStyle='#141c44';g.fillRect(b.x,y,b.w,b.h+20);g.beginPath();if(b.roof===0){g.moveTo(b.x-4,y);g.lineTo(b.x+b.w/2,y-34);g.lineTo(b.x+b.w+4,y)}else if(b.roof===1){g.moveTo(b.x+b.w*.35,y);g.lineTo(b.x+b.w*.5,y-60);g.lineTo(b.x+b.w*.65,y)}g.fill();
    for(let yy=y+14;yy<760;yy+=26)for(let xx=b.x+10;xx<b.x+b.w-14;xx+=20){if(((xx*7+yy*13+b.win)%5)<2){g.fillStyle='rgba(255,213,120,.85)';g.fillRect(xx,yy,9,13)}}});
  /* snow ground */
  const gr=g.createLinearGradient(0,760,0,1920);gr.addColorStop(0,'#eef3ff');gr.addColorStop(.35,'#cfdaf2');gr.addColorStop(1,'#8e9fca');g.fillStyle=gr;g.beginPath();g.moveTo(0,800);g.quadraticCurveTo(540,750,1080,800);g.lineTo(1080,1920);g.lineTo(0,1920);g.fill();
  bgCache=c}
function drawWorld(now,dt){
  if(!bgCache)drawStatic();ctx.drawImage(bgCache,0,0);
  for(const[x,y,s]of SKY){ctx.globalAlpha=.25+.6*Math.abs(Math.sin(now/1100+x));ctx.fillStyle='#fff';ctx.fillRect(x,y+120,s,s)}ctx.globalAlpha=1;
