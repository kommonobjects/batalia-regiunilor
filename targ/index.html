<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Târgul">
<meta name="theme-color" content="#070a16">
<title>Târgul de Crăciun · Craiova</title>
<style>
html,body{margin:0;background:#070a16;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
#c{width:min(calc(100vw - 20px),calc((100vh - 170px)*0.5625));min-width:280px;aspect-ratio:9/16;border-radius:14px;box-shadow:0 10px 40px #000a;background:#0b1024}
body.live #wrap{padding:0;height:100vh;height:100dvh;justify-content:center;background:#070a16}
body.live #c{width:min(100vw,calc(100dvh*0.5625));min-width:0;border-radius:0;box-shadow:none}
body.land #c{aspect-ratio:16/9;width:min(calc(100vw - 20px),calc((100vh - 170px)*1.7778))}
body.land.live #c{width:min(100vw,calc(100dvh*1.7778))}
body.live #ctl{display:none}
#ctl{width:min(100%,720px);display:flex;flex-direction:column;gap:6px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
button,select,input{background:#1b2347;color:#fff;border:1px solid #33407a;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
button:hover{background:#26315f}
button.g{background:#3a2a07;border-color:#8a6510}
#st{opacity:.75}
label{display:flex;gap:4px;align-items:center}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="ytw" style="position:fixed;left:0;bottom:0;width:200px;height:113px;opacity:0.01;pointer-events:none;overflow:hidden"><div id="yt"></div></div>
<div id="ctl">
  <div class="row">
    <span>Simulator:</span>
    <button data-a="chat">💬 Comentariu</button>
    <button data-a="like">❤️ +30 like</button>
    <button data-a="like200">❤️ +200 like</button>
    <button data-a="board">📸 Poza serii</button>
  </div>
  <div class="row">
    <button class="g" data-g="1|Rose">🌹 Felinar</button>
    <button class="g" data-g="5|Finger Heart">🫰 Vin fiert</button>
    <button class="g" data-g="30|Doughnut">🍩 Glob</button>
    <button class="g" data-g="100|Hand Hearts">🫶 Artificii</button>
    <button class="g" data-g="100|Confetti">🎉 Ninsoare</button>
    <button class="g" data-g="199|Sunglasses">😎 Moș Crăciun</button>
  </div>
  <div class="row">
    <button data-a="live" style="background:#c62828;border-color:#ff5252;font-weight:700">▶️ MOD LIVE</button>
    <label><input type="checkbox" id="demo"> Demo automat (boți)</label>
    <button data-a="music">🎵 Muzică on/off</button>
    <button data-a="reset">🔄 Seară nouă</button>
  </div>
  <div class="row">
    <span>tik.tools:</span>
    <input id="ttUser" placeholder="user TikTok (fără @)" style="width:150px">
    <input id="ttKey" type="password" placeholder="API key" style="width:150px">
    <button data-a="tt">🔌 Salvează + conectează</button>
    <span id="st"></span>
  </div>
</div>
</div>
<script>
(()=>{
const Q=new URLSearchParams(location.search),LIVE=Q.has('live');
const OQ=Q.get('o'),LAND=OQ==='l'||(OQ!=='p'&&innerWidth>innerHeight);
const W=LAND?1920:1080,H=LAND?1080:1920,FF='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
if(LAND)document.body.classList.add('land');
if(!OQ){const mq=matchMedia('(orientation: landscape)');mq.addEventListener&&mq.addEventListener('change',()=>{if(mq.matches!==LAND)location.reload()})}
if(LIVE)document.body.classList.add('live');
/* portrait safe zone: TikTok covers ~0-130 (profile) and ~1280+ (chat) */
const SS=LAND?1:0.82,SOX=LAND?20:(1080-1080*0.82)/2,SOY=LAND?10:426,PX=LAND?1130:30,PW=LAND?760:1020;

/* ---------- Stages (co-op) ---------- */
const GOALS=(Q.get('goals')||'400,1200,2500').split(',').map(Number);
const STG=[{e:'⛸️',n:'Patinoarul'},{e:'🎠',n:'Caruselul'},{e:'🛷',n:'Sania lui Moș Crăciun'},{e:'🎄',n:'Bradul se aprinde'}];
let magic=0,stage=0,night=1,finaleUntil=0,stageT=0;
const users=new Map(),skaters=[],feedL=[],banners=[],pops=[],hearts_=[],lanterns=[],fw=[],flakes=[],globes=[],names=[];
let firstSk=null,king=null,mos=null,sleighFly=null,shakeT=0,snowBoost=0,cabUntil=0,nextCab=performance.now()+120000,nextHint=performance.now()+12000,hintI=0;
const giftCnt=[0,0,0,0,0,0];
for(let i=0;i<140;i++)flakes.push({x:Math.random()*1080,y:Math.random()*1060,v:30+Math.random()*60,r:1.5+Math.random()*3});
const COLS=['#e53935','#fdd835','#1e88e5','#43a047','#fb8c00','#ec407a','#8e24aa','#00bcd4','#ff7043','#7cb342'];
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function U(id,nick){let u=users.get(id);if(!u){u={id,nick:nick||id,cc:0,lk:0,lastC:0,likeT:0,pic:'',orn:false,col:COLS[users.size%COLS.length]};users.set(id,u)}if(nick)u.nick=nick;return u}
function feed(t,col){feedL.push({t,col});if(feedL.length>8)feedL.shift()}
function banner(title,sub,col,big){if(banners.length>3)banners.splice(1,1);banners.push({title,sub,col,big,t0:0})}
function short(n,k){n=n||'';return n.length>k?n.slice(0,k-1)+'…':n}
function topBy(k,min){let b=null;users.forEach(u=>{if(u[k]>=min&&(!b||u[k]>b[k]))b=u});return b}

/* ---------- Rink ---------- */
const RK={x:540,y:830,rx:470,ry:175};
function skate(u){let s=skaters.find(s=>s.u===u);if(!s){s={u,a:Math.random()*6.28,r:.35+Math.random()*.55,sp:(.25+Math.random()*.25)*(Math.random()<.5?-1:1),trick:0,say:'',sayT:0};skaters.push(s);if(skaters.length>28)skaters.shift();if(!firstSk){firstSk=u;banner('⛸️ PRIMUL PE GHEAȚĂ',u.nick,'#90caf9')}}return s}
function sxy(s){return[RK.x+Math.cos(s.a)*RK.rx*s.r,RK.y+Math.sin(s.a)*RK.ry*s.r]}
function addMagic(n){if(finaleUntil)return;magic+=n;while(stage<3&&magic>=GOALS[stage]){stage++;stageT=performance.now();const S=STG[stage];
  sfx('win');burst(80);banner(`${S.e} ${S.n.toUpperCase()}!`,stage===3?'mulțumim tuturor! 🎆':'s-a deschis la târg — mulțumim!','#FCD116',true);feed(`${S.e} ${S.n} s-a deschis!`,'#ffd54f');
  if(stage===3){finaleUntil=performance.now()+20000;cabUntil=performance.now()+14000;for(let k=0;k<14;k++)fw.push({x:120+Math.random()*840,y:60+Math.random()*300,t0:performance.now()+k*500,col:COLS[k%10]})}}}

function onChat(id,nick,text){
  const u=U(id,nick),t=norm(text),now=performance.now(),s=skate(u);
  s.say=short(String(text||'').replace(/\s+/g,' ').trim(),22);s.sayT=now;
  if(/\btarg/.test(t)&&now>cabUntil+20000)cabUntil=now+12000;
  if(now-u.lastC<2500)return;u.lastC=now;u.cc++;s.trick=now;addMagic(5);sfx('tick');
  const k=topBy('cc',3);if(k&&k!==king){king=k;if(k.cc>=6){feed(`👑 ${k.nick} e Regele patinoarului`,'#ffd54f')}}
}
function onLike(id,nick,n){
  const u=U(id,nick),now=performance.now();skate(u);u.lk+=n;addMagic(n);
  for(let i=0;i<Math.min(6,n);i++)hearts_.push({x:RK.x+(Math.random()-.5)*600,y:RK.y,vx:(Math.random()-.5)*60,vy:-140-Math.random()*120,l:1,col:u.col,s:20+Math.random()*14});
  if(!u.orn&&u.lk>=100){u.orn=true;names.push(u);if(names.length>12)names.shift();pop(u,'🎄 numele tău e în brad!');feed(`🎄 ${u.nick} și-a agățat numele în brad`,'#81c784')}
  else if(now-u.likeT>8000){u.likeT=now;pop(u,'❤️ x'+n)}
}
function onSocial(id,nick,kind){const u=U(id,nick);skate(u);banner(kind==='follow'?'⭐ FOLLOW NOU!':'📣 SHARE!',`mulțumim, ${u.nick}!`,'#90caf9');sfx('big')}

/* ---------- Gifts: decor only (never add magic) ---------- */
const GK=[
 {k:'felinar',e:'🌹',l:'Felinar',m:/rose|trandafir/i},
 {k:'vin',e:'🫰',l:'Vin fiert',m:/finger|inimioar/i},
 {k:'glob',e:'🍩',l:'Glob în brad',m:/dough|donut|gogoa/i},
 {k:'artificii',e:'🫶',l:'Artificii',m:/hand ?heart|inimi\b/i},
 {k:'ninsoare',e:'🎉',l:'Ninsoare',m:/confetti/i},
 {k:'mos',e:'😎',l:'Moș Crăciun',m:/sunglass|ochelari/i}];
const giftPic={};try{Object.assign(giftPic,JSON.parse(localStorage.getItem('tg_gpics')||'{}'))}catch(e){}
function gkind(name,unit){for(let i=0;i<GK.length;i++)if(name&&GK[i].m.test(name))return i;return unit>=199?5:unit>=100?3:unit>=30?2:unit>=5?1:0}
function burst(n){for(let i=0;i<n&&hearts_.length<200;i++)hearts_.push({x:Math.random()*1080,y:500+Math.random()*300,vx:(Math.random()-.5)*100,vy:-200-Math.random()*150,l:1,col:COLS[i%10],s:18+Math.random()*16})}
function onGift(id,nick,coins,gname,unit,gpic){
  const u=U(id,nick),now=performance.now(),s=skate(u);s.trick=now;
  unit=Math.max(1,Math.round(unit||coins||1));const ki=gkind(gname,unit),K=GK[ki];giftCnt[ki]++;
  if(gpic&&giftPic[K.k]!==gpic){giftPic[K.k]=gpic;try{localStorage.setItem('tg_gpics',JSON.stringify(giftPic))}catch(e){}}
  feed(`${K.e} ${u.nick} · ${K.l}`,u.col);const[x,y]=sxy(s);
  if(K.k==='felinar'){if(lanterns.length<30)lanterns.push({u,x,y:y-30,t0:now,dx:(Math.random()-.5)*60});pop(u,'🏮 felinar')}
  else if(K.k==='vin'){pop(u,'☕ vin fiert pentru toți');banner('☕ VIN FIERT PENTRU TOȚI',`din partea lui ${u.nick}`,u.col)}
  else if(K.k==='glob'){if(!globes.includes(u)){globes.push(u);if(globes.length>5)globes.shift()}sfx('big');banner('🎄 GLOB ÎN BRADUL TÂRGULUI',u.nick,u.col,true)}
  else if(K.k==='artificii'){for(let k=0;k<6;k++)fw.push({x:150+Math.random()*780,y:60+Math.random()*260,t0:now+k*350,col:COLS[k%10]});fw.nick=u.nick;fw.until=now+3500;sfx('win');banner('🎆 ARTIFICII',`de la ${u.nick}`,u.col,true)}
  else if(K.k==='ninsoare'){snowBoost=now+9000;banner('❄️ NINSOARE',`de la ${u.nick}`,'#90caf9')}
  else if(K.k==='mos'){mos=u;sleighFly={u,t0:now};shakeT=now+400;sfx('win');banner('🎅 MOȘ CRĂCIUN ÎȚI FACE CU MÂNA',u.nick,'#e53935',true)}
}
function pop(u,text){if(pops.length>=9)pops.shift();const s=skaters.find(s=>s.u===u);const[x1,y1]=s?sxy(s):[540,700];pops.push({u,text,col:u.col,x0:100+880*Math.random(),y0:1100,x1,y1:y1-40,t0:performance.now()})}
function newNight(now){night++;magic=0;stage=0;finaleUntil=0;firstSk=null;king=null;names.length=0;globes.length=0;skaters.length=0;giftCnt.fill(0);users.forEach(u=>{u.cc=0;u.lk=0;u.orn=false});
  banner(`🌙 SEARA ${night} LA TÂRG`,'patinoarul e deschis — scrie în chat!','#90caf9',true);feed(`🌙 Seara ${night} a început`,'#ffd54f')}

/* ---------- Helpers ---------- */
const imgs=new Map();
function img(url){if(!url)return null;let i=imgs.get(url);if(!i){i=new Image();i.referrerPolicy='no-referrer';i.src=url;imgs.set(url,i)}return i.complete&&i.naturalWidth?i:null}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function font(sz,w=800){ctx.font=`${w} ${sz}px ${FF}`}
function fit(t,max,sz,w=800){font(sz,w);while(ctx.measureText(t).width>max&&sz>12){sz-=2;font(sz,w)}return sz}
function txt(t,x,y,fill,stroke,lw){if(stroke){ctx.lineWidth=lw||6;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(t,x,y)}ctx.fillStyle=fill;ctx.fillText(t,x,y)}
function avatar(u,x,y,r,col){const c=col||u.col||'#888';ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.closePath();const im=img(u.pic);
  if(im){ctx.clip();ctx.drawImage(im,x-r,y-r,2*r,2*r)}else{ctx.fillStyle=c;ctx.fill();ctx.fillStyle='#fff';font(r|0,900);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText((u.nick||'?')[0].toUpperCase(),x,y+2)}
  ctx.restore();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.lineWidth=Math.max(3,r/8);ctx.strokeStyle=c;ctx.stroke()}
const BULB=['#ff5252','#ffd740','#69f0ae','#40c4ff','#ff80ab','#fff'];
function riders(){return [...users.values()].filter(u=>u.lk>0).sort((a,b)=>b.lk-a.lk).slice(0,8)}
function sleighCrew(){return [...users.values()].filter(u=>u.cc+u.lk/20>0).sort((a,b)=>(b.cc+b.lk/20)-(a.cc+a.lk/20)).slice(0,6)}

/* ---------- Scene (logical 1080x1060) ---------- */
const TREE={x:540,top:70,base:420};
const SLOT=[];[[0.35,[0]],[0.55,[-.5,.5]],[0.72,[-.66,0,.66]],[0.9,[-.75,-.25,.25,.75]],[0.98,[-.85,-.45,0,.45,.85]]].forEach(([f,xs])=>{const y=TREE.top+(TREE.base-TREE.top)*f,hw=(y-TREE.top)*.62;xs.forEach(a=>SLOT.push([TREE.x+a*hw,y-6]))});
function drawScene(now,dt){
  const sk=ctx.createLinearGradient(0,0,0,560);sk.addColorStop(0,'#0a1238');sk.addColorStop(1,'#2b3a7e');ctx.fillStyle=sk;ctx.fillRect(0,0,1080,600);
  for(let i=0;i<60;i++){const x=(i*173)%1080,y=(i*97)%380;ctx.globalAlpha=.3+.5*Math.abs(Math.sin(now/900+i));ctx.fillStyle='#fff';ctx.fillRect(x,y,2,2)}ctx.globalAlpha=1;
  ctx.fillStyle='#fff8e1';ctx.beginPath();ctx.arc(930,90,40,0,7);ctx.fill();ctx.fillStyle='#2b3a7e';ctx.beginPath();ctx.arc(915,80,36,0,7);ctx.fill();
  /* fireworks */
  for(let i=fw.length-1;i>=0;i--){const f=fw[i],q=(now-f.t0)/1600;if(q<0)continue;if(q>1){fw.splice(i,1);continue}ctx.globalAlpha=1-q;
    for(let k=0;k<24;k++){const a=k/24*6.283,r=q*130;ctx.fillStyle=f.col;ctx.beginPath();ctx.arc(f.x+Math.cos(a)*r,f.y+Math.sin(a)*r+q*q*40,4,0,7);ctx.fill()}}
  ctx.globalAlpha=1;ctx.textAlign='center';ctx.textBaseline='middle';if(fw.until>now){font(44,900);txt('🎆 '+fw.nick,540,150,'#fff','rgba(0,0,0,.8)',8)}
  /* Santa's sleigh: unlocked at stage 2 (loops), or gift fly-by */
  if(stage>=2){const q=((now-stageT)/14000)%1,x=1200-q*1450,y=140+Math.sin(q*12)*25;drawSleigh(x,y,sleighCrew(),now)}
  if(sleighFly){const q=(now-sleighFly.t0)/6000;if(q>1)sleighFly=null;else{const x=-150+q*1400,y=230;ctx.save();ctx.translate(x,y);ctx.scale(-1,1);font(60,400);ctx.fillText('🦌🦌🛷',0,0);ctx.restore();avatar(sleighFly.u,x-60,y-34,26,'#e53935');font(24,900);txt('🎅👋 '+short(sleighFly.u.nick,14),x-60,y+16,'#fff','rgba(0,0,0,.8)',5)}}
  /* ground */
  const gr=ctx.createLinearGradient(0,430,0,1060);gr.addColorStop(0,'#dfe7f5');gr.addColorStop(1,'#9fb0d6');ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(0,470);ctx.quadraticCurveTo(540,410,1080,470);ctx.lineTo(1080,1060);ctx.lineTo(0,1060);ctx.fill();
  /* tree */
  const T=TREE,lit=stage>=3,glow=.35+.65*Math.min(1,magic/GOALS[2]);ctx.fillStyle='#4e342e';ctx.fillRect(T.x-20,T.base,40,36);
  if(lit){ctx.save();ctx.shadowColor='#ffd54f';ctx.shadowBlur=50}
  [[0,.42],[.28,.72],[.55,1]].forEach(([a,b])=>{const y0=T.top+(T.base-T.top)*a,y1=T.top+(T.base-T.top)*b,hw=(y1-T.top)*.62;ctx.fillStyle='#1b5e20';ctx.beginPath();ctx.moveTo(T.x,y0-10);ctx.lineTo(T.x+hw,y1);ctx.lineTo(T.x-hw,y1);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(T.x-hw*.9,y1-5,hw*1.8,5)});
  if(lit)ctx.restore();
  for(let k=0;k<44;k++){const f=((k*37)%100)/100,y=T.top+30+(T.base-T.top-40)*f,hw=(y-T.top)*.58,x=T.x+hw*(((k*61)%100)/50-1);ctx.fillStyle=BULB[k%6];ctx.globalAlpha=glow*(.4+.6*Math.abs(Math.sin(now/400+k)));ctx.beginPath();ctx.arc(x,y,lit?6:4,0,7);ctx.fill()}
  ctx.globalAlpha=1;font(lit?74:58,400);ctx.fillText('⭐',T.x,T.top-12);
  names.forEach((u,i)=>{const s=SLOT[i%SLOT.length];ctx.fillStyle=BULB[i%5];ctx.beginPath();ctx.arc(s[0],s[1],8,0,7);ctx.fill();font(14,900);txt(short(u.nick,9),s[0],s[1]+15,'#fff','rgba(0,0,0,.85)',4)});
  globes.forEach((u,i)=>{const s=[[T.x-80,T.base-50],[T.x+80,T.base-50],[T.x,T.base-120],[T.x-45,T.base-200],[T.x+45,T.base-200]][i];ctx.save();ctx.shadowColor='#ffd54f';ctx.shadowBlur=16;avatar(u,s[0],s[1],26,'#ffd54f');ctx.restore()});
  /* stalls (decor) */
  [[760,'#c62828','☕ VIN FIERT'],[910,'#2e7d32','🥨 COVRIGI']].forEach(([x,c,l])=>{ctx.fillStyle='#8d6e63';ctx.fillRect(x,470,130,80);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x-10,476);ctx.lineTo(x+65,430);ctx.lineTo(x+140,476);ctx.fill();ctx.fillStyle=`rgba(255,213,79,.7)`;ctx.fillRect(x+12,492,106,44);font(17,900);txt(l,x+65,514,'#3e2723')});
  drawCarousel(now);
  drawRink(now,dt);
  /* lanterns */
  for(let i=lanterns.length-1;i>=0;i--){const l=lanterns[i],q=(now-l.t0)/7000;if(q>1){lanterns.splice(i,1);continue}const x=l.x+l.dx*q+Math.sin(q*12)*14,y=l.y-q*(l.y+40);
    ctx.globalAlpha=q>.8?(1-q)*5:1;ctx.save();ctx.shadowColor='#ffab40';ctx.shadowBlur=24;font(40,400);ctx.textAlign='center';ctx.fillText('🏮',x,y);ctx.restore();font(16,900);txt(short(l.u.nick,12),x,y+30,'#ffe0b2','rgba(0,0,0,.8)',4)}
  ctx.globalAlpha=1;
  const boost=now<snowBoost?3:1;ctx.fillStyle='#fff';flakes.forEach((f,k)=>{if(k>=flakes.length/3*boost)return;f.y+=f.v*dt*boost;f.x+=Math.sin(now/1000+k)*.4;if(f.y>1060){f.y=-5;f.x=Math.random()*1080}ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill()});ctx.globalAlpha=1;
  drawFx(now,dt);
}
function drawSleigh(x,y,crew,now){font(64,400);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🦌🦌',x-120,y);
  rrect(x-30,y-28,250,60,18);ctx.fillStyle='#c62828';ctx.fill();ctx.strokeStyle='#ffd54f';ctx.lineWidth=4;ctx.stroke();font(44,400);ctx.fillText('🎅',x,y-30);
  crew.forEach((u,i)=>{const cx=x+40+i*34,cy=y-32-(i%2)*10;avatar(u,cx,cy,17,'#ffd54f')});
  font(18,900);txt('🛷 sania Moșului',x+95,y+14,'#fff','rgba(0,0,0,.6)',4)}
function drawCarousel(now){const cx=230,cy=600,open=stage>=1,rot=open?now/2600:0;
  ctx.fillStyle='#5d4037';rrect(cx-150,cy-10,300,40,10);ctx.fill();
  const rs=riders();
