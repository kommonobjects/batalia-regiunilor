<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Târgul">
<meta name="theme-color" content="#070a16">
<title>Târgul de Crăciun · Craiova</title>
<style>
html,body{margin:0;background:#070a16;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
#c{width:min(calc(100vw - 20px),calc((100vh - 170px)*0.5625));min-width:280px;aspect-ratio:9/16;border-radius:14px;box-shadow:0 10px 40px #000a;background:#0b1024}
body.live #wrap{padding:0;height:100vh;height:100dvh;justify-content:center;background:#070a16}
body.live #c{width:min(100vw,calc(100dvh*0.5625));min-width:0;border-radius:0;box-shadow:none}
body.land #c{aspect-ratio:16/9;width:min(calc(100vw - 20px),calc((100vh - 170px)*1.7778))}
body.land.live #c{width:min(100vw,calc(100dvh*1.7778))}
body.live #ctl{display:none}
#ctl{width:min(100%,720px);display:flex;flex-direction:column;gap:6px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
button,select,input{background:#1b2347;color:#fff;border:1px solid #33407a;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
button:hover{background:#26315f}
button.g{background:#3a2a07;border-color:#8a6510}
#st{opacity:.75}
label{display:flex;gap:4px;align-items:center}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="ytw" style="position:fixed;left:0;bottom:0;width:200px;height:113px;opacity:0.01;pointer-events:none;overflow:hidden"><div id="yt"></div></div>
<div id="ctl">
  <div class="row">
    <span>Simulator:</span>
    <select id="selReg"></select>
    <button data-a="join">✍️ Intră la căsuță</button>
    <button data-a="chat">💬 Comentariu</button>
    <button data-a="like">❤️ +30 like</button>
    <button data-a="board">📸 Tabla târgului</button>
  </div>
  <div class="row">
    <button class="g" data-g="1|Rose">🌹 Felinar</button>
    <button class="g" data-g="5|Finger Heart">🫰 Vin fiert</button>
    <button class="g" data-g="30|Doughnut">🍩 Glob</button>
    <button class="g" data-g="100|Hand Hearts">🫶 Roata</button>
    <button class="g" data-g="100|Confetti">🎉 Artificii</button>
    <button class="g" data-g="199|Sunglasses">😎 Moș Crăciun</button>
  </div>
  <div class="row">
    <button data-a="live" style="background:#c62828;border-color:#ff5252;font-weight:700">▶️ MOD LIVE</button>
    <label><input type="checkbox" id="demo"> Demo automat (boți)</label>
    <button data-a="music">🎵 Muzică on/off</button>
    <button data-a="reset">🔄 Rundă nouă</button>
  </div>
  <div class="row">
    <span>tik.tools:</span>
    <input id="ttUser" placeholder="user TikTok (fără @)" style="width:150px">
    <input id="ttKey" type="password" placeholder="API key" style="width:150px">
    <button data-a="tt">🔌 Salvează + conectează</button>
    <span id="st"></span>
  </div>
</div>
</div>
<script>
(()=>{
const Q=new URLSearchParams(location.search),LIVE=Q.has('live');
const OQ=Q.get('o'),LAND=OQ==='l'||(OQ!=='p'&&innerWidth>innerHeight);
const W=LAND?1920:1080,H=LAND?1080:1920,FF='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
if(LAND)document.body.classList.add('land');
if(!OQ){const mq=matchMedia('(orientation: landscape)');mq.addEventListener&&mq.addEventListener('change',()=>{if(mq.matches!==LAND)location.reload()})}
if(LIVE)document.body.classList.add('live');
const ROUND=Math.max(1,+Q.get('r')||5)*60,END_SHOW=12;
/* scene is drawn in a 1080x1060 logical box */
const SOX=LAND?20:0,SOY=LAND?10:245,PX=LAND?1130:30,PW=LAND?760:1020;

/* ---------- Stalls = regions ---------- */
const REG=[
 {name:'Moldova',  gen:'Moldovei',  col:'#e53935',alias:['moldova','moldoveni','iasi']},
 {name:'Muntenia', gen:'Munteniei', col:'#fdd835',alias:['muntenia','munteni','bucuresti']},
 {name:'Oltenia',  gen:'Olteniei',  col:'#1e88e5',alias:['oltenia','olteni','craiova']},
 {name:'Ardeal',   gen:'Ardealului',col:'#43a047',alias:['ardeal','transilvania','ardeleni','cluj']},
 {name:'Banat',    gen:'Banatului', col:'#fb8c00',alias:['banat','banateni','timisoara']},
 {name:'Crișana',  gen:'Crișanei',  col:'#ec407a',alias:['crisana','oradea']},
 {name:'Maramureș',gen:'Maramureșului',col:'#a1887f',alias:['maramures','baia mare']},
 {name:'Bucovina', gen:'Bucovinei', col:'#8e24aa',alias:['bucovina','suceava']},
 {name:'Dobrogea', gen:'Dobrogei',  col:'#00bcd4',alias:['dobrogea','constanta','tulcea']},
];
const N=REG.length,LV=60,MAXLV=5;
REG.forEach((g,i)=>{const r=i/3|0,c=i%3;g.x=15+c*360;g.y=572+r*160;g.w=330;g.h=150;g.lights=0;g.lvl=0;g.mem=0;g.wins=0;g.flash=0});

/* ---------- State ---------- */
const users=new Map();
let round=0,phase='play',roundEnd=0,endUntil=0,winner=-1,firstCit=null,mos=null,colind=null;
let cabUntil=0,nextCab=performance.now()+90000,nextHint=performance.now()+15000,hintI=0;
const riders=[],globes=[],names=[],lanterns=[],fw=[],flakes=[],feedL=[],banners=[],pops=[],hearts_=[];
let sleigh=null,shakeT=0,likeTot=0,likeBase=0,likeGoal=300,snowBoost=0,lastLeader=-1;
const giftCnt=[0,0,0,0,0,0];
for(let i=0;i<140;i++)flakes.push({x:Math.random()*1080,y:Math.random()*1060,v:30+Math.random()*60,r:1.5+Math.random()*3});

const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function findReg(t){for(let i=0;i<N;i++)for(const a of REG[i].alias)if(t.includes(a))return i;return -1}
function U(id,nick){let u=users.get(id);if(!u){u={id,nick:nick||id,team:null,cc:0,lk:0,lastC:0,likeT:0,pic:'',orn:false};users.set(id,u)}if(nick)u.nick=nick;return u}
function weakest(){let m=1e9,c=[];REG.forEach((g,i)=>{if(g.mem<m){m=g.mem;c=[i]}else if(g.mem===m)c.push(i)});return c[(Math.random()*c.length)|0]}
function feed(t,col){feedL.push({t,col});if(feedL.length>8)feedL.shift()}
function banner(title,sub,col,big){if(banners.length>3)banners.splice(1,1);banners.push({title,sub,col,big,t0:0})}
function short(n,k){return n.length>k?n.slice(0,k-1)+'…':n}
function merchant(i){let b=null;users.forEach(u=>{if(u.team===i&&u.cc>=2&&(!b||u.cc>b.cc))b=u});return b}
function topColind(){let b=null;users.forEach(u=>{if(u.cc>=3&&(!b||u.cc>b.cc))b=u});return b}

function join(u,r,quiet){if(u.team!=null)REG[u.team].mem--;u.team=r;REG[r].mem++;
  const busy=users.size>300;if(!quiet&&(!busy||Math.random()<.1)){feed(`👋 ${u.nick} vine la căsuța ${REG[r].gen}`,REG[r].col);pop(u,'👋 '+REG[r].name)}sfx('join')}
function addLights(t,n){if(phase!=='play')return;const g=REG[t];g.lights+=n;g.flash=1;
  const lv=Math.min(MAXLV,g.lights/LV|0);if(lv>g.lvl){g.lvl=lv;hearts(t,25);sfx('big');banner(`✨ CĂSUȚA ${g.gen.toUpperCase()} · NIVELUL ${lv}`,lv>=MAXLV?'complet împodobită!':['','ghirlande','steluțe','om de zăpadă','brăduț','artificii'][lv],g.col)}
  let L=0;for(let i=1;i<N;i++)if(REG[i].lights>REG[L].lights)L=i;
  if(L!==lastLeader&&REG[L].lights>20){lastLeader=L;feed(`🏆 ${REG[L].name} conduce târgul!`,REG[L].col)}}

function onChat(id,nick,text){
  const u=U(id,nick),t=norm(text),r=findReg(t),now=performance.now();
  if(r>=0&&r!==u.team)join(u,r);else if(u.team==null)join(u,weakest(),true);
  if(/\btarg/.test(t)&&now>cabUntil+20000)cabUntil=now+12000;
  if(now-u.lastC<2500)return;u.lastC=now;u.cc++;
  addLights(u.team,3);sfx('tick');
  if(!firstCit&&phase==='play'){firstCit=u;pop(u,'⭐ Primul la târg');banner('⭐ PRIMUL LA TÂRG',u.nick,REG[u.team].col)}
  const c=topColind();if(c&&c!==colind){colind=c;if(c.cc>=8){pop(c,'🎤 Colindătorul serii');feed(`🎤 ${c.nick} e Colindătorul serii`,'#ffd54f')}}
  if(Math.random()<.25||u.cc===1)pop(u,'💡 +3');
}
function onLike(id,nick,n){
  const u=U(id,nick);if(u.team==null)join(u,weakest(),true);
  u.acc=(u.acc||0)+n;while(u.acc>=5){u.acc-=5;addLights(u.team,1)}
  u.lk+=n;hearts(u.team,Math.min(8,n));const now=performance.now();
  if(!u.orn&&u.lk>=100){u.orn=true;names.push(u);if(names.length>12)names.shift();pop(u,'🎄 numele tău e în brad!');feed(`🎄 ${u.nick} și-a agățat numele în brad`,'#81c784')}
  else if(now-u.likeT>6000){u.likeT=now;pop(u,'❤️ x'+n)}
  likeTot+=n;if(likeTot-likeBase>=likeGoal){likeBase=likeTot;likeGoal=Math.min(800,likeGoal+100);snowBoost=now+9000;
    banner('❄️ NINSOARE MAGICĂ!',`mulțumim pentru like-uri, ${u.nick}!`,'#90caf9',true);sfx('win')}
}
function onSocial(id,nick,kind){const u=U(id,nick);if(u.team==null)join(u,weakest(),true);
  banner(kind==='follow'?'⭐ FOLLOW NOU!':'📣 SHARE!',`mulțumim, ${u.nick}!`,REG[u.team].col);pop(u,kind==='follow'?'⭐':'📣');sfx('big')}

/* ---------- Gifts: decor only, never lights or ranking ---------- */
const GK=[
 {k:'felinar',e:'🌹',l:'Felinar',m:/rose|trandafir/i},
 {k:'vin',e:'🫰',l:'Vin fiert',m:/finger|inimioar/i},
 {k:'glob',e:'🍩',l:'Glob în brad',m:/dough|donut|gogoa/i},
 {k:'roata',e:'🫶',l:'Roata',m:/hand ?heart|inimi\b/i},
 {k:'artificii',e:'🎉',l:'Artificii',m:/confetti/i},
 {k:'mos',e:'😎',l:'Moș Crăciun',m:/sunglass|ochelari/i}];
const giftPic={};try{Object.assign(giftPic,JSON.parse(localStorage.getItem('tg_gpics')||'{}'))}catch(e){}
function gkind(name,unit){for(let i=0;i<GK.length;i++)if(name&&GK[i].m.test(name))return i;return unit>=199?5:unit>=100?3:unit>=30?2:unit>=5?1:0}
function onGift(id,nick,coins,gname,unit,gpic){
  const u=U(id,nick);if(u.team==null)join(u,weakest(),true);
  coins=Math.max(1,Math.round(coins));unit=Math.max(1,Math.round(unit||coins));
  const ki=gkind(gname,unit),K=GK[ki];giftCnt[ki]++;
  if(gpic&&giftPic[K.k]!==gpic){giftPic[K.k]=gpic;try{localStorage.setItem('tg_gpics',JSON.stringify(giftPic))}catch(e){}}
  const T=u.team,g=REG[T],now=performance.now(),[sx,sy]=dest(T);
  hearts(T,Math.min(25,5+coins));feed(`${K.e} ${u.nick} · ${K.l}`,g.col);
  if(K.k==='felinar'){if(lanterns.length<30)lanterns.push({u,x:sx,y:sy-20,t0:now,dx:(Math.random()-.5)*60});pop(u,'🏮 felinar')}
  else if(K.k==='vin'){pop(u,'☕ vin fiert pentru toți');banner('☕ VIN FIERT PENTRU TOȚI',`din partea lui ${u.nick}`,g.col)}
  else if(K.k==='glob'){if(!globes.includes(u)){globes.push(u);if(globes.length>5)globes.shift()}sfx('big');banner('🎄 GLOB ÎN BRADUL TÂRGULUI',u.nick,g.col,true)}
  else if(K.k==='roata'){if(!riders.includes(u)){riders.unshift(u);if(riders.length>3)riders.pop()}sfx('big');banner('🎡 ÎN ROATA PANORAMICĂ',u.nick,g.col,true)}
  else if(K.k==='artificii'){for(let k=0;k<6;k++)fw.push({x:150+Math.random()*780,y:60+Math.random()*260,t0:now+k*350,col:[g.col,'#FCD116','#fff','#ff80ab'][k%4]});fw.nick=u.nick;fw.until=now+3500;sfx('win');banner('🎆 ARTIFICII',`de la ${u.nick}`,g.col,true)}
  else if(K.k==='mos'){mos=u;sleigh={u,t0:now};shakeT=now+400;sfx('win');banner('🎅 MOȘUL TÂRGULUI',u.nick,'#e53935',true)}
}

/* ---------- Round flow ---------- */
function endRound(now){phase='end';endUntil=now+END_SHOW*1000;let w=0;for(let i=1;i<N;i++)if(REG[i].lights>REG[w].lights)w=i;winner=w;REG[w].wins++;
  REG[w].champ=merchant(w);colind=topColind();sfx('win');feed(`🏆 ${REG[w].name} are cea mai frumoasă căsuță!`,REG[w].col)}
function newRound(now){phase='play';round++;roundEnd=now+ROUND*1000;winner=-1;firstCit=null;colind=null;lastLeader=-1;
  REG.forEach(g=>{g.lights=0;g.lvl=0;g.champ=null});users.forEach(u=>{u.cc=0;u.lk=0;u.orn=false;u.acc=0});
  riders.length=0;globes.length=0;names.length=0;banners.length=0;giftCnt.fill(0);
  feed(`🔔 Runda ${round}: scrie regiunea ta și aprinde-ți căsuța!`,'#ffd54f')}

/* ---------- Helpers ---------- */
const imgs=new Map();
function img(url){if(!url)return null;let i=imgs.get(url);if(!i){i=new Image();i.referrerPolicy='no-referrer';i.src=url;imgs.set(url,i)}return i.complete&&i.naturalWidth?i:null}
function dest(t){const g=REG[t];return [g.x+g.w/2,g.y+30]}
function pop(u,text){if(u.team==null)return;if(pops.length>=9)pops.shift();const[x1,y1]=dest(u.team);pops.push({u,text,col:REG[u.team].col,x0:100+880*Math.random(),y0:1100,x1,y1,t0:performance.now()})}
function hearts(t,n){const[x,y]=dest(t);for(let i=0;i<n&&hearts_.length<160;i++)hearts_.push({x:x+(Math.random()-.5)*60,y,vx:(Math.random()-.5)*80,vy:-120-Math.random()*140,l:1,col:REG[t].col,s:20+Math.random()*16})}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function font(sz,w=800){ctx.font=`${w} ${sz}px ${FF}`}
function fit(t,max,sz,w=800){font(sz,w);while(ctx.measureText(t).width>max&&sz>12){sz-=2;font(sz,w)}return sz}
function txt(t,x,y,fill,stroke,lw){if(stroke){ctx.lineWidth=lw||6;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(t,x,y)}ctx.fillStyle=fill;ctx.fillText(t,x,y)}
function avatar(u,x,y,r,col){const c=col||(u.team!=null?REG[u.team].col:'#888');ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.closePath();const im=img(u.pic);
  if(im){ctx.clip();ctx.drawImage(im,x-r,y-r,2*r,2*r)}else{ctx.fillStyle=c;ctx.fill();ctx.fillStyle='#fff';font(r|0,900);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText((u.nick||'?')[0].toUpperCase(),x,y+2)}
  ctx.restore();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.lineWidth=Math.max(3,r/8);ctx.strokeStyle=c;ctx.stroke()}
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const BULB=['#ff5252','#ffd740','#69f0ae','#40c4ff','#ff80ab','#fff'];

/* ---------- Scene (logical 1080x1060) ---------- */
const TREE={x:540,top:70,base:540};
const SLOT=[];[[0.32,[0]],[0.5,[-.5,.5]],[0.68,[-.66,0,.66]],[0.86,[-.75,-.25,.25,.75]],[0.97,[-.8,-.4,0,.4,.8]]].forEach(([f,xs])=>{const y=TREE.top+(TREE.base-TREE.top)*f,hw=(y-TREE.top)*.62;xs.forEach(a=>SLOT.push([TREE.x+a*hw,y-6]))});
function drawScene(now,dt){
  const sk=ctx.createLinearGradient(0,0,0,600);sk.addColorStop(0,'#0a1238');sk.addColorStop(1,'#26326e');ctx.fillStyle=sk;ctx.fillRect(0,0,1080,620);
  for(let i=0;i<60;i++){const x=(i*173)%1080,y=(i*97)%420;ctx.globalAlpha=.3+.5*Math.abs(Math.sin(now/900+i));ctx.fillStyle='#fff';ctx.fillRect(x,y,2,2)}ctx.globalAlpha=1;
  /* fireworks */
  for(let i=fw.length-1;i>=0;i--){const f=fw[i],q=(now-f.t0)/1600;if(q<0)continue;if(q>1){fw.splice(i,1);continue}ctx.globalAlpha=1-q;
    for(let k=0;k<24;k++){const a=k/24*6.283,r=q*130;ctx.fillStyle=f.col;ctx.beginPath();ctx.arc(f.x+Math.cos(a)*r,f.y+Math.sin(a)*r+q*q*40,4,0,7);ctx.fill()}}
  ctx.globalAlpha=1;if(fw.until>now){ctx.textAlign='center';ctx.textBaseline='middle';font(44,900);txt('🎆 '+fw.nick,540,140,'#fff','rgba(0,0,0,.8)',8)}
  /* sleigh */
  if(sleigh){const q=(now-sleigh.t0)/6000;if(q>1)sleigh=null;else{const x=1180-q*1400,y=150+Math.sin(q*9)*20;ctx.textAlign='center';ctx.textBaseline='middle';font(70,400);ctx.fillText('🦌🦌🛷',x,y);avatar(sleigh.u,x+90,y-30,26,'#e53935');font(26,900);txt('🎅 '+short(sleigh.u.nick,14),x+90,y+20,'#fff','rgba(0,0,0,.8)',5)}}
  /* ground */
  const gr=ctx.createLinearGradient(0,520,0,1060);gr.addColorStop(0,'#cfd8ec');gr.addColorStop(1,'#8f9cc4');ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(0,560);ctx.quadraticCurveTo(540,500,1080,560);ctx.lineTo(1080,1060);ctx.lineTo(0,1060);ctx.fill();
  /* ferris wheel */
  const wx=165,wy=300,wr=160,rot=now/9000;ctx.strokeStyle='#90a4ae';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(wx-70,560);ctx.lineTo(wx,wy);ctx.lineTo(wx+70,560);ctx.stroke();
  ctx.lineWidth=5;ctx.strokeStyle='#ffd54f';ctx.beginPath();ctx.arc(wx,wy,wr,0,7);ctx.stroke();
  for(let k=0;k<8;k++){const a=rot+k/8*6.283,cx=wx+Math.cos(a)*wr,cy=wy+Math.sin(a)*wr;ctx.strokeStyle='rgba(255,213,79,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(wx,wy);ctx.lineTo(cx,cy);ctx.stroke();
    ctx.fillStyle=BULB[k%6];ctx.globalAlpha=.6+.4*Math.sin(now/200+k);ctx.beginPath();ctx.arc(cx,cy,6,0,7);ctx.fill();ctx.globalAlpha=1;
    const rd=riders[k%4===0?k/4:9];rrect(cx-22,cy+4,44,34,8);ctx.fillStyle=['#c62828','#1565c0','#2e7d32','#f9a825'][k%4];ctx.fill();if(k%4===0&&riders[k/4]){avatar(riders[k/4],cx,cy+22,19,'#ffd54f')}}
  riders.forEach((u,i)=>{const a=rot+i*4/8*6.283,cx=wx+Math.cos(a)*wr,cy=wy+Math.sin(a)*wr;ctx.textAlign='center';font(18,900);txt(short(u.nick,10),cx,cy+56,'#fff','rgba(0,0,0,.85)',4)});
  /* light arch + rink */
  ctx.lineWidth=10;ctx.strokeStyle='#5d4037';ctx.beginPath();ctx.moveTo(800,560);ctx.lineTo(800,300);ctx.moveTo(1050,560);ctx.lineTo(1050,300);ctx.stroke();
  for(let k=0;k<=20;k++){const a=Math.PI+k/20*Math.PI,x=925+Math.cos(a)*125,y=300+Math.sin(a)*90;ctx.fillStyle=BULB[k%6];ctx.globalAlpha=.55+.45*Math.sin(now/250+k*.8);ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill()}
  ctx.globalAlpha=1;ctx.textAlign='center';ctx.textBaseline='middle';font(30,900);txt('CRAIOVA',925,265,'#ffe082','rgba(0,0,0,.6)',5);font(17,800);txt('TÂRGUL DE CRĂCIUN',925,305,'#fff','rgba(0,0,0,.6)',4);
  ctx.fillStyle='rgba(225,245,254,.85)';ctx.beginPath();ctx.ellipse(925,520,115,26,0,0,7);ctx.fill();for(let k=0;k<3;k++){const a=now/1500+k*2.1;font(26,400);ctx.fillText('⛸️',925+Math.cos(a)*85,515+Math.sin(a)*12)}
  /* tree */
  const T=TREE;ctx.fillStyle='#4e342e';ctx.fillRect(T.x-22,T.base,44,40);

  if(!u||!k){st.textContent='tik.tools: lipsește user sau key';return false}
  wsUrl=`wss://api.tik.tools?uniqueId=${encodeURIComponent(u)}&apiKey=${encodeURIComponent(k)}`;wsName='tik.tools @'+u+' [cheie '+k.slice(0,3)+'…'+k.slice(-4)+', '+k.length+' caractere]';
  if(ws){wantWs=false;try{ws.close()}catch(e){}}
  tf();return true;
}
let wsAnnounced=false,wsState='none',retryAt=0;const noted=new Set();function note(t){st.textContent=t.slice(0,120)}
function tf(){
  wantWs=true;
  try{ws=new WebSocket(wsUrl)}catch(e){st.textContent=wsName+': conexiune refuzată';return}
  ws.onopen=()=>{wsState='on';st.textContent=wsName+' conectat ✅';wsAnnounced=true};
  ws.onclose=e=>{const why=(e.code||'')+' '+(e.reason||'');wsState=e.code===4404?'wait':(e.code===4401?'bad':'off');const m=/Retry after (\d+)/.exec(e.reason||'');const d=m?Math.min(+m[1],300)*1000+1000:8000;retryAt=performance.now()+d;st.textContent=wsName+' deconectat ('+why+') — reîncerc…';note('⚠️ tik.tools: '+why);if(wantWs)setTimeout(tf,d)};
  ws.onerror=()=>{};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}
    if(!m.event&&(m.type||m.message)){note('ℹ️ tik.tools: '+(m.type||'')+' '+(m.message||m.reason||''));return}
    if(m.event==='roomInfo'||m.event==='control'){const d=m.data||{};note('ℹ️ '+m.event+': '+JSON.stringify(d).slice(0,80));return}
    const ev=m.event,d=m.data||{},us=d.user||{},id=us.uniqueId||d.uniqueId||us.userId||d.userId||'anon',nick=us.nickname||d.nickname||id;
    {const pp=us.profilePicture||d.profilePicture||{},pic=us.profilePictureUrl||d.profilePictureUrl||(pp.url||pp.urls||pp.urlList||[])[0]||((us.avatarThumb||{}).urlList||[])[0]||'';if(pic)U(id,nick).pic=pic}
    if(ev==='chat')onChat(id,nick,d.comment);
    else if(ev==='gift'){if(d.giftType===1&&!d.repeatEnd)return;const gp=d.giftPictureUrl||((d.gift||{}).image||{}).url_list?.[0]||((d.giftDetails||{}).giftImage||{}).giftPictureUrl||'';onGift(id,nick,(d.diamondCount||1)*(d.repeatCount||1),d.giftName,d.diamondCount||1,gp)}
    else if(ev==='like')onLike(id,nick,d.likeCount||1);
    else if(ev==='follow'||ev==='share')onSocial(id,nick,ev);
  };
}

/* ---------- Simulator controls ---------- */
const selReg=document.getElementById('selReg');REG.forEach((g,i)=>selReg.add(new Option(g.name,i)));
const tester=()=>{const r=+selReg.value,u=U('tester_'+r,'tu_'+norm(REG[r].name));if(u.team!==r)join(u,r);return u};
document.getElementById('ctl').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.g){const[c,n]=b.dataset.g.split('|');const u=tester();onGift(u.id,u.nick,+c,n,+c);return}
  const a=b.dataset.a;
  if(a==='join')tester();else if(a==='chat'){const u=tester();u.lastC=0;onChat(u.id,u.nick,'frumos')}
  else if(a==='like'){const u=tester();onLike(u.id,u.nick,30)}else if(a==='board')cabUntil=performance.now()+12000;
  else if(a==='reset')newRound(performance.now());else if(a==='live')enterLive();else if(a==='music')music(!musicOn);
  else if(a==='tt'){LS.set('br_user',document.getElementById('ttUser').value.trim());const k=document.getElementById('ttKey').value.replace(/[^A-Za-z0-9_\-]/g,'');if(k)LS.set('br_key',k);document.getElementById('ttKey').value='';tt()}});
document.getElementById('ttUser').value=LS.get('br_user');
const DEF_LIST=Q.get('music')||'PL39z-AAkkatusz2cbNJ5TQCUxVzGhSxKR';
let yt=null,ytReady=false,musicOn=false;
if(Q.get('music')!=='0'){window.onYouTubeIframeAPIReady=()=>{yt=new YT.Player('yt',{width:200,height:113,playerVars:{listType:'playlist',list:DEF_LIST,playsinline:1,controls:0,loop:1,rel:0},events:{onReady:()=>{ytReady=true;try{yt.setShuffle(true);yt.setLoop(true);yt.setVolume(100);if(LIVE||document.body.classList.contains('live')){yt.playVideo();musicOn=true}}catch(e){}},onStateChange:e=>{if(musicOn&&(e.data===0||e.data===2)&&(LIVE||document.body.classList.contains('live'))){try{e.data===0?yt.nextVideo():yt.playVideo()}catch(_){}}},onError:()=>{try{yt.nextVideo()}catch(e){}}}})};
{const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';document.head.appendChild(sc)}}
function music(on){musicOn=on;if(!ytReady)return;try{on?yt.playVideo():yt.pauseVideo()}catch(e){}}
let wake=null;async function keepAwake(){try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&document.body.classList.contains('live')){keepAwake();music(true)}});
function enterLive(){document.body.classList.add('live');setDemo(false);users.clear();REG.forEach(g=>{g.mem=0;g.wins=0});feedL.length=0;round=0;mos=null;newRound(performance.now());keepAwake();music(true);audio();
  if(!ws||ws.readyState>1){if(!tt())feed('⚠️ Nu e conectat la LIVE — pune user + key','#ff8a80')}}
cv.addEventListener('click',()=>{if(document.body.classList.contains('live')&&ytReady&&yt.getPlayerState&&yt.getPlayerState()!==1)music(true)});
newRound(performance.now());
if(LIVE){setDemo(Q.get('demo')==='1');if(!tt()){wsUrl='ws://localhost:21213/';wsName='TikFinity';tf()}}else setDemo(true);
requestAnimationFrame(frame);
})();
</script>
