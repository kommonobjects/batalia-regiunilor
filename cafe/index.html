/* ---------- Seats: bar stools for singles, tables for two ---------- */

  if(T.solo){const s=T.solo;T.solo=null;s.soloT=null;setTimeout(()=>seat(s),0)}T.a=a;T.b=b;T.t=now;T.flame=0;a.table=T;b.table=T;a.invite=null;b.invite=null;sfx('win');burstAt(T.x,T.y,40);banner('💞 MASĂ PENTRU DOI',`${a.nick} & ${b.nick}`,'#f06292',true);setTimeout(()=>{freeDed={u:a,to:b,msg:'💬 '+ICE[(Math.random()*ICE.length)|0],t0:performance.now(),ice:1}},3500);feed(`💞 ${a.nick} & ${b.nick} s-au așezat la o masă`,'#f48fb1')}

  if(stage===3){finaleUntil=performance.now()+20000;for(let k=0;k<14;k++)fw.push({x:120+Math.random()*840,y:300+Math.random()*200,t0:performance.now()+k*450,col:COLS[k%10]})}}}

/* ---------- Places: "De unde ne scrii?" ---------- */
const PLACES=[[/\b(uk|anglia|londra|london|marea britanie|manchester|birmingham)\b/,'🇬🇧','UK'],[/\b(italia|italy|roma|torino|milano|bologna|padova)\b/,'🇮🇹','Italia'],[/\b(spania|spain|madrid|barcelona|valencia|castellon)\b/,'🇪🇸','Spania'],[/\b(germania|germany|deutschland|munchen|berlin|stuttgart|frankfurt)\b/,'🇩🇪','Germania'],[/\b(franta|france|paris|lyon)\b/,'🇫🇷','Franța'],[/\b(austria|viena|wien)\b/,'🇦🇹','Austria'],[/\b(belgia|bruxelles|belgium)\b/,'🇧🇪','Belgia'],[/\b(olanda|amsterdam|netherlands)\b/,'🇳🇱','Olanda'],[/\b(irlanda|dublin|ireland)\b/,'🇮🇪','Irlanda'],[/\b(danemarca|suedia|norvegia|finlanda)\b/,'🇸🇪','Nordice'],[/\b(sua|usa|america|canada)\b/,'🇺🇸','America'],[/\b(moldova|chisinau)\b/,'🇲🇩','Moldova'],[/\b(romania|bucuresti|iasi|cluj|timisoara|constanta|craiova|brasov|galati|bacau|suceava|oradea|ploiesti|sibiu|arad|pitesti|buzau|botosani)\b/,'🇷🇴','România']];
const placeCnt={};
function findPlace(t){for(const [re,f,n] of PLACES)if(re.test(t))return[f,n];return null}

/* ---------- Chat ---------- */
const ITEMS=[[/\b(cafea|coffee|espresso)\b/,'☕',0],[/\b(ceai|tea)\b/,'🍵',1],[/\bvin\b/,'🍷',2],[/\b(cocktail|cocteil|tuica|palinca|bere)\b/,'🍸',3]];
const QUESTIONS=['Ce ți-e cel mai dor de acasă?','Care e cel mai frumos loc unde ai fost?','Ce mâncare ai comanda acum?','Ce melodie îți aduce aminte de cineva?','Ce te face să zâmbești azi?','Cafea sau ceai? Și de ce?','Ce ai face într-o zi liberă perfectă?','Ce sfat i-ai da celui de acum 5 ani?'];
function onChat(id,nick,text){
  let u=U(id,nick),t=norm(text),now=performance.now();entrance(u,now);u.seen=now;seat(u);
  const cl=clean(text);u.chatT=now;const isCmd=/^\s*(@|pune\b|alta\b|next|skip|da\b|nu\b|dedic|melod|piesa|cantec|prezint|reflector|single|singur|divort|plec|secret|schimba)/.test(t);if(cl){if(!isCmd){u.say=short(cl,26);u.sayT=now}u.lastMsg=cl}

    if(tg){u.atTarget=tg;u.atT=now}

  if(/hai (sa ne )?(cuplam|cuplăm)|cine (vine|sta|stă) (cu mine )?la mas|(vine|vino) cineva la mas|caut (pe cineva|partener|partenera)|hai la masa/.test(t))u.openCall=now;
  {const mm2=/@([^\s@]+)/.exec(String(text||''));if(mm2&&yes(t)){const q2=norm(mm2[1]).replace(/[?!.,;:]+$/,'');const X=[...users.values()].find(o=>o!==u&&norm(o.nick).replace(/\s/g,'').startsWith(q2));if(X&&X.openCall&&now-X.openCall<120000&&now-(X.chatT||0)<120000&&!(X.table&&X.table===u.table)){X.openCall=0;pairUp(X,u,now)}}}

    const q=String(text||'').replace(/^\s*\S+/,'').replace(/@\S+/g,'').replace(/\b(te rog|va rog|vă rog|pentru|pt|o piesa|o piesă|melodia|piesa|de la|lui|si|și)\b/gi,' ').replace(/[^\p{L}\p{N}' ]/gu,' ').replace(/\s+/g,' ').trim();

function tf(){
  wantWs=true;
  try{ws=new WebSocket(wsUrl)}catch(e){st.textContent=wsName+': conexiune refuzată';return}
  ws.onopen=()=>{wsState='on';st.textContent=wsName+' conectat ✅';wsAnnounced=true};
  ws.onclose=e=>{const why=(e.code||'')+' '+(e.reason||'');wsState=e.code===4404?'wait':(e.code===4401?'bad':'off');const m=/Retry after (\d+)/.exec(e.reason||'');const d=m?Math.min(+m[1],300)*1000+1000:8000;retryAt=performance.now()+d;st.textContent=wsName+' deconectat ('+why+') — reîncerc…';note('⚠️ tik.tools: '+why);if(wantWs)setTimeout(tf,d)};
  ws.onerror=()=>{};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}
    if(!m.event&&(m.type||m.message)){note('ℹ️ tik.tools: '+(m.type||'')+' '+(m.message||m.reason||''));return}
    if(m.event==='roomInfo'||m.event==='control'){const d=m.data||{};note('ℹ️ '+m.event+': '+JSON.stringify(d).slice(0,80));return}
    const ev=m.event,d=m.data||{},us=d.user||{},id=us.uniqueId||d.uniqueId||us.userId||d.userId||'anon',nick=us.nickname||d.nickname||id;
    {const pp=us.profilePicture||d.profilePicture||{},pic=us.profilePictureUrl||d.profilePictureUrl||(pp.url||pp.urls||pp.urlList||[])[0]||((us.avatarThumb||{}).urlList||[])[0]||'';if(pic)U(id,nick).pic=pic}
    if(ev==='chat')onChat(id,nick,d.comment);
    else if(ev==='gift'){if(d.giftType===1&&!d.repeatEnd)return;const gp=d.giftPictureUrl||((d.gift||{}).image||{}).url_list?.[0]||((d.giftDetails||{}).giftImage||{}).giftPictureUrl||'';onGift(id,nick,(d.diamondCount||1)*(d.repeatCount||1),d.giftName,d.diamondCount||1,gp)}
    else if(ev==='like')onLike(id,nick,d.likeCount||1);
    else if(ev==='follow'||ev==='share')onSocial(id,nick,ev);
    else if(ev==='member'||ev==='join')onJoin(id,nick);
  };
}

{const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';document.head.appendChild(sc)}}
