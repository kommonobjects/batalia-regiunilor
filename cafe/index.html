<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Cafeneaua">
<meta name="theme-color" content="#070a16">
<title>Cafeneaua celor singuri</title>
<style>
html,body{margin:0;background:#070a16;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
#c{width:min(calc(100vw - 20px),calc((100vh - 170px)*0.5625));min-width:280px;aspect-ratio:9/16;border-radius:14px;box-shadow:0 10px 40px #000a;background:#0b1024}
body.live #wrap{padding:0;height:100vh;height:100dvh;justify-content:center;background:#070a16}
body.live #c{width:min(100vw,calc(100dvh*0.5625));min-width:0;border-radius:0;box-shadow:none}
body.land #c{aspect-ratio:16/9;width:min(calc(100vw - 20px),calc((100vh - 170px)*1.7778))}
body.land.live #c{width:min(100vw,calc(100dvh*1.7778))}
body.live #ctl{display:none}
#ctl{width:min(100%,720px);display:flex;flex-direction:column;gap:6px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
button,select,input{background:#1b2347;color:#fff;border:1px solid #33407a;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
button:hover{background:#26315f}
button.g{background:#3a2a07;border-color:#8a6510}
#st{opacity:.75}
label{display:flex;gap:4px;align-items:center}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="ytw" style="position:fixed;left:0;bottom:0;width:200px;height:113px;opacity:0.01;pointer-events:none;overflow:hidden"><div id="yt"></div></div>
<div id="ctl">
  <div class="row">
    <span>Simulator:</span>
    <button data-a="chat">💬 Comentariu</button>
    <button data-a="like">❤️ +30 like</button>
    <button data-a="like200">❤️ +200 like</button>
    <button data-a="board">📸 Poza serii</button>
  </div>
  <div class="row">
    <button class="g" data-g="1|Rose">🌹 Felinar</button>
    <button class="g" data-g="5|Finger Heart">🫰 Cafea dată</button>
    <button class="g" data-g="30|Doughnut">🍩 Desert</button>
    <button class="g" data-g="100|Hand Hearts">🫶 Inimă pe geam</button>
    <button class="g" data-g="100|Confetti">🎉 Dedicație</button>
    <button class="g" data-g="199|Sunglasses">😎 Rundă</button>
  </div>
  <div class="row">
    <button data-a="live" style="background:#c62828;border-color:#ff5252;font-weight:700">▶️ MOD LIVE</button>
    <label><input type="checkbox" id="demo"> Demo automat (boți)</label>
    <button data-a="music">🎵 Muzică on/off</button>
    <button data-a="reset">🔄 Seară nouă</button>
  </div>
  <div class="row">
    <span>tik.tools:</span>
    <input id="ttUser" placeholder="user TikTok (fără @)" style="width:150px">
    <input id="ttKey" type="password" placeholder="API key" style="width:150px">
    <button data-a="tt">🔌 Salvează + conectează</button>
    <span id="st"></span>
  </div>
</div>
</div>
<script>
(()=>{
const Q=new URLSearchParams(location.search),LIVE=Q.has('live');
const OQ=Q.get('o'),LAND=OQ==='l'||(OQ!=='p'&&innerWidth>innerHeight);
const W=LAND?1920:1080,H=LAND?1080:1920,FF='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
if(LAND)document.body.classList.add('land');
if(LIVE)document.body.classList.add('live');
const WS=LAND?1080/1920:1,WX=LAND?40:0,PX=LAND?700:30,PW=LAND?1180:1020;

/* ---------- Co-op atmosphere stages ---------- */
const GOALS=(Q.get('goals')||'300,800,1500').split(',').map(Number);
const STG=[{e:'🕯️',n:'Lumânări'},{e:'🔥',n:'Șemineul'},{e:'🎷',n:'Muzică live'},{e:'💃',n:'Dansul serii'}];
let nightStart=performance.now(),magic=0,stage=0,night=1,finaleUntil=0,stageT=0;
const users=new Map(),feedL=[],banners=[],pops=[],hearts_=[],fw=[],flyH=[],notes=[],tables=[],winHearts=[];
let barPulse=0,patron=null,firstIn=null,shakeT=0,cabUntil=0,nextCab=performance.now()+150000,nextHint=performance.now()+12000,hintI=0,dedic=null,question=null,nextQ=performance.now()+8000,qi=0,round=null;
const giftCnt=[0,0,0,0,0,0],served=[0,0,0,0];
const COLS=['#e57373','#f06292','#ba68c8','#7986cb','#4fc3f7','#4db6ac','#aed581','#ffb74d','#ff8a65','#a1887f'];
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function U(id,nick){let u=users.get(id);if(!u){u={id,nick:nick||id,cc:0,lk:0,lastC:0,likeT:0,pic:'',col:COLS[users.size%COLS.length],seen:0};users.set(id,u)}if(nick)u.nick=nick;return u}
function feed(t,col){feedL.push({t,col});if(feedL.length>8)feedL.shift()}
function banner(title,sub,col,big){if(banners.length>3)banners.splice(1,1);banners.push({title,sub,col,big,t0:0})}
function short(n,k){n=n||'';return n.length>k?n.slice(0,k-1)+'…':n}
/* safety: hide phone numbers, @handles, links, social-app names */
function clean(t){return String(t||'').replace(/https?:\/\/\S+|www\.\S+/gi,'•••').replace(/(\+?\d[\d\s.-]{5,}\d)/g,'•••').replace(/@\S+/g,'').replace(/\b(insta(gram)?|snap(chat)?|whats ?app|telegram|ig|numarul|nr\.? ?tel)\b/gi,'•••').replace(/\s+/g,' ').trim()}

/* ---------- Seats: bar stools for singles, tables for two ---------- */
const STOOLS=[];for(let i=0;i<14;i++)STOOLS.push({x:95+i*68,y:1090,u:null});
const TABLES=[[165,840],[915,840],[300,985],[780,985]].map(([x,y])=>({x,y,a:null,b:null,t:0,flame:0}));const VIP={x:540,y:880};let coupleOfNight=null;
function seat(u){if(u.table||u.stool!=null)return;let i=STOOLS.findIndex(s=>!s.u);if(i<0){let old=0;STOOLS.forEach((s,k)=>{if((s.u.seen||0)<(STOOLS[old].u.seen||0))old=k});STOOLS[old].u.stool=null;i=old}STOOLS[i].u=u;u.stool=i;
  if(!firstIn){firstIn=u;banner('☕ PRIMUL CLIENT AL SERII',u.nick,'#ffb74d')}}
function unseat(u){if(u.stool!=null){STOOLS[u.stool].u=null;u.stool=null}}
function seatPos(u){if(u.table){const T=u.table;return T.a===u?[T.x-70,T.y-30]:[T.x+70,T.y-30]}if(u.stool!=null)return[STOOLS[u.stool].x,STOOLS[u.stool].y-70];return[540,1000]}
function pairUp(a,b,now){[a,b].forEach(p=>{const O=p.table;if(O){const o=O.a===p?O.b:O.a;O.a=null;O.b=null;p.table=null;if(o){o.table=null;seat(o)}}});let T=TABLES.find(t=>!t.a)||TABLES.reduce((o,t)=>t.t<o.t?t:o);if(T.a){T.a.table=null;T.b.table=null}
  [a,b].forEach(unseat);T.a=a;T.b=b;T.t=now;T.flame=0;a.table=T;b.table=T;a.invite=null;b.invite=null;sfx('win');burstAt(T.x,T.y,40);banner('💞 MASĂ PENTRU DOI',`${a.nick} & ${b.nick}`,'#f06292',true);feed(`💞 ${a.nick} & ${b.nick} s-au așezat la o masă`,'#f48fb1')}
function addMagic(n){if(finaleUntil)return;magic+=n;while(stage<3&&magic>=GOALS[stage]){stage++;stageT=performance.now();const S=STG[stage];sfx('win');banner(`${S.e} ${S.n.toUpperCase()}!`,stage===3?'toată cafeneaua dansează! 💃🕺':'cafeneaua se încălzește — mulțumim!','#ffd54f',true);
  if(stage===3){finaleUntil=performance.now()+20000;cabUntil=performance.now()+9000;for(let k=0;k<14;k++)fw.push({x:120+Math.random()*840,y:300+Math.random()*200,t0:performance.now()+k*450,col:COLS[k%10]})}}}

/* ---------- Places: "De unde ne scrii?" ---------- */
const PLACES=[[/\b(uk|anglia|londra|london|marea britanie|manchester|birmingham)\b/,'🇬🇧','UK'],[/\b(italia|italy|roma|torino|milano|bologna|padova)\b/,'🇮🇹','Italia'],[/\b(spania|spain|madrid|barcelona|valencia|castellon)\b/,'🇪🇸','Spania'],[/\b(germania|germany|deutschland|munchen|berlin|stuttgart|frankfurt)\b/,'🇩🇪','Germania'],[/\b(franta|france|paris|lyon)\b/,'🇫🇷','Franța'],[/\b(austria|viena|wien)\b/,'🇦🇹','Austria'],[/\b(belgia|bruxelles|belgium)\b/,'🇧🇪','Belgia'],[/\b(olanda|amsterdam|netherlands)\b/,'🇳🇱','Olanda'],[/\b(irlanda|dublin|ireland)\b/,'🇮🇪','Irlanda'],[/\b(danemarca|suedia|norvegia|finlanda)\b/,'🇸🇪','Nordice'],[/\b(sua|usa|america|canada)\b/,'🇺🇸','America'],[/\b(moldova|chisinau)\b/,'🇲🇩','Moldova'],[/\b(romania|bucuresti|iasi|cluj|timisoara|constanta|craiova|brasov|galati|bacau|suceava|oradea|ploiesti|sibiu|arad|pitesti|buzau|botosani)\b/,'🇷🇴','România']];
const placeCnt={};
function findPlace(t){for(const [re,f,n] of PLACES)if(re.test(t))return[f,n];return null}

/* ---------- Chat ---------- */
const ITEMS=[[/\b(cafea|coffee|espresso)\b/,'☕',0],[/\b(ceai|tea)\b/,'🍵',1],[/\bvin\b/,'🍷',2],[/\b(cocktail|cocteil|tuica|palinca|bere)\b/,'🍸',3]];
const QUESTIONS=['Ce ți-e cel mai dor de acasă?','Care e cel mai frumos loc unde ai fost?','Ce mâncare ai comanda acum?','Ce melodie îți aduce aminte de cineva?','Ce te face să zâmbești azi?','Cafea sau ceai? Și de ce?','Ce ai face într-o zi liberă perfectă?','Ce sfat i-ai da celui de acum 5 ani?'];
function onChat(id,nick,text){
  const u=U(id,nick),t=norm(text),now=performance.now();u.seen=now;seat(u);
  const cl=clean(text);if(cl){u.say=short(cl,26);u.sayT=now;u.lastMsg=cl}
  if(/\bcafenea|\bpoza/.test(t)&&now>cabUntil+20000)cabUntil=now+8000;
  const p=findPlace(t);if(p&&!u.place){u.place=p;placeCnt[p[1]]=(placeCnt[p[1]]||0)+1;pop(u,p[0]+' '+p[1])}
  for(const [re,e,k] of ITEMS)if(re.test(t)){u.item=e;u.itemT=now;served[k]++;break}
  const m=/@([^\s@]+)/.exec(String(text||''));if(m){const q=norm(m[1]);const tg=[...users.values()].find(o=>o!==u&&(norm(o.nick).replace(/\s/g,'').startsWith(q)||norm(o.id).startsWith(q)));
    if(tg){u.atTarget=tg;u.atT=now}
    if(tg&&!(u.table&&u.table===tg.table)){if(tg.invite===u&&now-(tg.inviteT||0)<180000)pairUp(tg,u,now);else{u.invite=tg;u.inviteT=now;pop(u,'💌 → '+short(tg.nick,10))}}}
  if(question&&now-question.t0<90000&&cl.length>3&&!m){notes.push({u,txt:short(cl,40),t0:now});if(notes.length>6)notes.shift()}
  if(now-u.lastC<2500)return;u.lastC=now;u.cc++;addMagic(5);sfx('tick');
}
function onLike(id,nick,n){const u=U(id,nick),now=performance.now();u.seen=now;seat(u);u.lk+=n;addMagic(n*.5);barPulse=now;
  if(flyH.length<40){const[sx,sy]=seatPos(u);for(let i=0;i<Math.min(3,1+n/10);i++)flyH.push({x:sx,y:sy,t0:now+i*120,col:u.col})}}
function onJoin(id,nick){const u=U(id,nick),now=performance.now();if(u.greeted&&now-u.greeted<600000)return;u.greeted=now;u.seen=now;seat(u);u.say='👋 bună seara!';u.sayT=now}
function onSocial(id,nick,kind){const u=U(id,nick);u.seen=performance.now();seat(u);if(kind==='follow')u.star=1;banner(kind==='follow'?'⭐ FOLLOW NOU!':'📣 SHARE!',`mulțumim, ${u.nick}!`,'#ffb74d');sfx('big')}

/* ---------- Gifts: visibility only ---------- */
const GK=[
 {k:'trandafir',e:'🌹',l:'Trandafir',m:/rose|trandafir/i},
 {k:'cafea',e:'🫰',l:'Cafea dată mai departe',m:/finger|inimioar/i},
 {k:'desert',e:'🍩',l:'Desert',m:/dough|donut|gogoa/i},
 {k:'geam',e:'🫶',l:'Inimă pe geam',m:/hand ?heart|inimi\b/i},
 {k:'dedicatie',e:'🎉',l:'Dedicație',m:/confetti/i},
 {k:'runda',e:'😎',l:'Rundă pentru toți',m:/sunglass|ochelari/i}];
function gkind(name,unit){for(let i=0;i<GK.length;i++)if(name&&GK[i].m.test(name))return i;return unit>=199?5:unit>=100?3:unit>=30?2:unit>=5?1:0}
function burstAt(x,y,n){for(let i=0;i<n&&hearts_.length<200;i++)hearts_.push({x,y,vx:(Math.random()-.5)*160,vy:-150-Math.random()*150,l:1,col:COLS[i%10],s:20+Math.random()*14})}
let voiceQ=[],lastSay=0;function say(t){try{if(!('speechSynthesis' in window)||Q.get('tts')==='0')return;const n=performance.now();if(n-lastSay<2500||speechSynthesis.speaking){if(voiceQ.length<3)voiceQ.push(t);return}lastSay=n;const m=new SpeechSynthesisUtterance(t);m.lang='ro-RO';const v=speechSynthesis.getVoices().find(v=>/^ro/i.test(v.lang));if(v)m.voice=v;m.onend=()=>{const nx=voiceQ.shift();if(nx)setTimeout(()=>say(nx),300)};speechSynthesis.speak(m)}catch(e){}}
function onGift(id,nick,coins,gname,unit,gpic){
  const u=U(id,nick),now=performance.now();u.seen=now;seat(u);unit=Math.max(1,Math.round(unit||coins||1));coins=Math.max(1,Math.round(coins||unit));
  const ki=gkind(gname,unit),K=GK[ki];giftCnt[ki]++;u.gifts=(u.gifts||0)+1;u.coins=(u.coins||0)+coins;
  u.combo=(now-(u.lastGift||0)<15000)?(u.combo||1)+1:1;u.lastGift=now;if(u.combo>=2)pop(u,'🔥 combo x'+u.combo);
  if(!String(id).startsWith('bot_'))say(`Mulțumim, ${u.nick}!`);feed(`${K.e} ${u.nick} · ${K.l}`,u.col);const[x,y]=seatPos(u);
  const tg=(u.atTarget&&now-(u.atT||0)<180000&&u.atTarget!==u)?u.atTarget:(u.table?(u.table.a===u?u.table.b:u.table.a):null);
  if(tg&&['trandafir','cafea','desert','geam'].includes(K.k)){const[tx,ty]=seatPos(tg);
    if(K.k==='trandafir'){tg.rose=(tg.rose||0)+1;burstAt(tx,ty,14);banner('🌹 UN TRANDAFIR PENTRU '+short(tg.nick,14).toUpperCase(),`de la ${u.nick}`,'#e91e63')}
    else if(K.k==='cafea'){tg.item='☕';tg.itemT=now;banner('☕ O CAFEA PENTRU '+short(tg.nick,14).toUpperCase(),`de la ${u.nick}`,'#ffb74d')}
    else if(K.k==='desert'){tg.item='🍰';tg.itemT=now+60000;banner('🍰 DESERT PENTRU '+short(tg.nick,14).toUpperCase(),`de la ${u.nick}`,'#f48fb1',true)}
    else{winHearts.push({u,u2:tg,t0:now,x:120+Math.random()*840,y:300+Math.random()*180});if(winHearts.length>4)winHearts.shift();banner('🫶 INIMĂ PE GEAM',`${u.nick} ❤️ ${tg.nick}`,'#f06292',true)}
    if(u.table&&u.table===tg.table){const T=u.table,lv0=flameLv(T);T.flame+=1+coins/50;const lv=flameLv(T);if(lv>lv0){burstAt(T.x,T.y,30);pop(u,'💞 nivel '+lv)}if(lv>=5&&coupleOfNight!==T){coupleOfNight=T;coupleNames=[T.a.nick,T.b.nick];banner('💞 CUPLUL SERII',`${T.a.nick} & ${T.b.nick}`,'#f06292',true);for(let k=0;k<8;k++)fw.push({x:120+Math.random()*840,y:300+Math.random()*200,t0:now+k*300,col:COLS[k%10]})}}
    if(!String(id).startsWith('bot_'))say(`${u.nick} pentru ${tg.nick}!`)}
  else if(K.k==='trandafir'){u.rose=(u.rose||0)+1;burstAt(x,y,12);pop(u,'🌹')}
  else if(K.k==='cafea'){let nw=null;users.forEach(o=>{if(o!==u&&(o.stool!=null||o.table)&&(!nw||(o.greeted||o.seen)>(nw.greeted||nw.seen)))nw=o});if(nw){nw.item='☕';nw.itemT=now;banner('☕ CAFEA DATĂ MAI DEPARTE',`${u.nick} → ${nw.nick}`,'#ffb74d')}}
  else if(K.k==='desert'){u.item='🍰';u.itemT=now+60000;sfx('big');pop(u,'🍰 desert')}
  else if(K.k==='geam'){winHearts.push({u,t0:now,x:120+Math.random()*840,y:300+Math.random()*180});if(winHearts.length>4)winHearts.shift();sfx('big');banner('🫶 INIMĂ PE GEAM',u.nick,u.col,true)}
  else if(K.k==='dedicatie'){const msg=clean(u.lastMsg||'')||'❤️ pentru toți singuraticii din seara asta';dedic={u,msg:short(msg,90),t0:now,dur:10000+Math.min(20000,coins*100)};sfx('win');if(!String(id).startsWith('bot_'))setTimeout(()=>say(`Dedicație de la ${u.nick}: ${msg}`),800)}
  else if(K.k==='runda'){round={u,t0:now};users.forEach(o=>{if(o.stool!=null||o.table){o.item='🥂';o.itemT=now}});sfx('win');banner('🥂 RUNDĂ PENTRU TOATĂ CAFENEAUA',`din partea lui ${u.nick}`,'#ffd54f',true)}
  /* weekly patrons */
  try{const wk=weekKey(),w=JSON.parse(localStorage.getItem('cf_week')||'{}');if(w.k!==wk){w.k=wk;w.t={}}if(!String(id).startsWith('bot_')||!LIVE){const e=w.t[id]||{nick:u.nick,pic:u.pic,c:0};e.c+=coins;e.nick=u.nick;e.pic=u.pic||e.pic;w.t[id]=e}localStorage.setItem('cf_week',JSON.stringify(w))}catch(e){}
  if(coins>=1000||(u.combo>=5&&coins>=100)){takeover={u,t0:now};shakeT=now+600}
  let top=null;users.forEach(o=>{if(o.coins&&(!top||o.coins>top.coins))top=o});
  if(top&&top!==patron){const was=patron;patron=top;banner('👑 '+(was?'NOUL ':'')+'PATRON AL CAFENELEI',`${top.nick} · suporterul #1 al serii`,'#ffd54f',true);if(!String(top.id).startsWith('bot_'))setTimeout(()=>say(`${top.nick} este patronul cafenelei!`),2600)}
}
let takeover=null,coupleNames=null;
function flameLv(T){return Math.min(5,1+Math.floor((T.flame||0)/2))}
function weekKey(){const d=new Date();const day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day);return d.toISOString().slice(0,10)}
function weekTop(){try{const w=JSON.parse(localStorage.getItem('cf_week')||'{}');if(w.k!==weekKey())return[];return Object.values(w.t||{}).sort((a,b)=>b.c-a.c).slice(0,5)}catch(e){return[]}}
function vipPair(){return[...users.values()].filter(o=>o.coins).sort((a,b)=>b.coins-a.coins).slice(0,2)}
function pop(u,text){if(pops.length>=9)pops.shift();const[x1,y1]=seatPos(u);pops.push({u,text,col:u.col,x0:100+880*Math.random(),y0:1250,x1,y1:y1-40,t0:performance.now()})}
function newNight(now){coupleOfNight=null;const T=(now-nightStart)/1000;if(nightStart&&T>20){const f=Math.max(.5,Math.min(3,420/T));for(let i=0;i<3;i++)GOALS[i]=Math.max(100,Math.round(GOALS[i]*f/50)*50)}nightStart=now;night++;magic=0;stage=0;finaleUntil=0;firstIn=null;notes.length=0;
  users.forEach(u=>{u.cc=0;u.lk=0});banner(`🌙 SEARA ${night} LA CAFENEA`,'scrie în chat și ia loc la bar!','#ffb74d',true)}

/* ---------- Helpers ---------- */
const imgs=new Map();
function img(url){if(!url)return null;let i=imgs.get(url);if(!i){i=new Image();i.referrerPolicy='no-referrer';i.src=url;imgs.set(url,i)}return i.complete&&i.naturalWidth?i:null}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function font(sz,w=800){ctx.font=`${w} ${sz}px ${FF}`}
function fit(t,max,sz,w=800){font(sz,w);while(ctx.measureText(t).width>max&&sz>12){sz-=2;font(sz,w)}return sz}

    ctx.shadowColor='#ffd54f';ctx.shadowBlur=60;avatar(T.u,cx,cy-60,rr,'#ffd54f');ctx.shadowBlur=0;ctx.textAlign='center';ctx.textBaseline='middle';
    fit(T.u.nick,900,72,900);txt(T.u.nick,cx,cy+150,'#fff','#6d2c1a',10);font(40,900);txt('✨ MULȚUMIM! ✨',cx,cy+225,'#ffd54f','rgba(0,0,0,.8)',8);ctx.restore()}}
  if(wsState!=='none'){const map={on:['🟢 CONECTAT','#1b5e20'],wait:['🟡 Aștept TikTok… '+Math.max(0,Math.ceil((retryAt-now)/1000))+'s','#6d5300'],bad:['🔴 Cheie greșită','#7f0000'],off:['🔴 Deconectat — reîncerc','#7f0000']};const [t,c]=map[wsState];font(22,800);const w=ctx.measureText(t).width+28,by=LAND?H-50:16;rrect(W-w-16,by,w,38,19);ctx.fillStyle=c;ctx.fill();ctx.textAlign='left';ctx.textBaseline='middle';txt(t,W-w-2,by+20,'#fff')}

/* ---------- Persist the evening across reloads (6h) ---------- */
function saveState(){if(!LIVE)return;try{const us=[...users.values()].filter(u=>!String(u.id).startsWith('bot_')&&(u.coins||u.cc||u.lk)).slice(-300).map(u=>({id:u.id,nick:u.nick,pic:u.pic,col:u.col,coins:u.coins||0,gifts:u.gifts||0,cc:u.cc,lk:u.lk,rose:u.rose,star:u.star,place:u.place}));
  localStorage.setItem('cf_state',JSON.stringify({t:Date.now(),night,magic,stage,goals:GOALS,patron:patron&&patron.id,first:firstIn&&firstIn.id,served,placeCnt,us}))}catch(e){}}

/* ---------- TikFinity (local WebSocket, only works when the file runs on the streaming PC) ---------- */
const st=document.getElementById('st');let ws=null,wantWs=false;
const LS={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let wsUrl='ws://localhost:21213/',wsName='TikFinity';
function tt(){
  const u=(Q.get('user')||LS.get('br_user')).replace(/^@/,''),k=Q.get('key')||LS.get('br_key');
  if(!u||!k){st.textContent='tik.tools: lipsește user sau key';return false}
  wsUrl=`wss://api.tik.tools?uniqueId=${encodeURIComponent(u)}&apiKey=${encodeURIComponent(k)}`;wsName='tik.tools @'+u+' [cheie '+k.slice(0,3)+'…'+k.slice(-4)+', '+k.length+' caractere]';
  if(ws){wantWs=false;try{ws.close()}catch(e){}}
  tf();return true;
}
let wsAnnounced=false,wsState='none',retryAt=0;const noted=new Set();function note(t){st.textContent=t.slice(0,120)}
function tf(){
  wantWs=true;
  try{ws=new WebSocket(wsUrl)}catch(e){st.textContent=wsName+': conexiune refuzată';return}
  ws.onopen=()=>{wsState='on';st.textContent=wsName+' conectat ✅';wsAnnounced=true};
  ws.onclose=e=>{const why=(e.code||'')+' '+(e.reason||'');wsState=e.code===4404?'wait':(e.code===4401?'bad':'off');const m=/Retry after (\d+)/.exec(e.reason||'');const d=m?Math.min(+m[1],300)*1000+1000:8000;retryAt=performance.now()+d;st.textContent=wsName+' deconectat ('+why+') — reîncerc…';note('⚠️ tik.tools: '+why);if(wantWs)setTimeout(tf,d)};
  ws.onerror=()=>{};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}
    if(!m.event&&(m.type||m.message)){note('ℹ️ tik.tools: '+(m.type||'')+' '+(m.message||m.reason||''));return}
    if(m.event==='roomInfo'||m.event==='control'){const d=m.data||{};note('ℹ️ '+m.event+': '+JSON.stringify(d).slice(0,80));return}
    const ev=m.event,d=m.data||{},us=d.user||{},id=us.uniqueId||d.uniqueId||us.userId||d.userId||'anon',nick=us.nickname||d.nickname||id;
    {const pp=us.profilePicture||d.profilePicture||{},pic=us.profilePictureUrl||d.profilePictureUrl||(pp.url||pp.urls||pp.urlList||[])[0]||((us.avatarThumb||{}).urlList||[])[0]||'';if(pic)U(id,nick).pic=pic}
    if(ev==='chat')onChat(id,nick,d.comment);
    else if(ev==='gift'){if(d.giftType===1&&!d.repeatEnd)return;const gp=d.giftPictureUrl||((d.gift||{}).image||{}).url_list?.[0]||((d.giftDetails||{}).giftImage||{}).giftPictureUrl||'';onGift(id,nick,(d.diamondCount||1)*(d.repeatCount||1),d.giftName,d.diamondCount||1,gp)}
    else if(ev==='like')onLike(id,nick,d.likeCount||1);
    else if(ev==='follow'||ev==='share')onSocial(id,nick,ev);
    else if(ev==='member'||ev==='join')onJoin(id,nick);
  };
}

{const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';document.head.appendChild(sc)}}

if(LIVE){loadState();setDemo(Q.get('demo')==='1');if(!tt()){wsUrl='ws://localhost:21213/';wsName='TikFinity';tf()}}else setDemo(true);
requestAnimationFrame(frame);
})();
