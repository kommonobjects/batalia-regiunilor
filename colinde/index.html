<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f24">
<title>Colindăm!</title>
<style>
html,body{margin:0;background:#070a16;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
#c{width:min(calc(100vw - 20px),calc((100vh - 170px)*0.5625));min-width:280px;aspect-ratio:9/16;border-radius:14px;box-shadow:0 10px 40px #000a;background:#0b1024}
body.live #wrap{padding:0;height:100vh;height:100dvh;justify-content:center}
body.live #c{width:min(100vw,calc(100dvh*0.5625));min-width:0;border-radius:0;box-shadow:none}
body.live #ctl{display:none}
#ctl{width:min(100%,720px);display:flex;flex-direction:column;gap:6px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
button,input{background:#1b2347;color:#fff;border:1px solid #33407a;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
button.g{background:#3a2a07;border-color:#8a6510}
#st{opacity:.75}
label{display:flex;gap:4px;align-items:center}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div style="position:fixed;left:0;bottom:0;width:200px;height:113px;opacity:0.01;pointer-events:none;overflow:hidden"><div id="yt"></div></div>
<div id="ctl">
  <div class="row"><span>Simulator:</span>
    <button data-c="colindăm">🎄 colindăm</button><button data-c="fată">💃 fată</button><button data-c="băiat">🕺 băiat</button><button data-c="hop">🗣️ hop</button>
    <button data-c="ninge">❄️ ninge</button><button data-a="like">❤️ +20 like</button></div>
  <div class="row">
    <button class="g" data-g="1|Rose">🌹 1</button><button class="g" data-g="5|Finger Heart">🫰 5</button><button class="g" data-g="30|Doughnut">🍩 30</button>
    <button class="g" data-g="100|Hand Hearts">🫶 100</button><button class="g" data-g="100|Confetti">🎉 100</button><button class="g" data-g="199|Sunglasses">😎 199</button></div>
  <div class="row">
    <button data-a="live" style="background:#c62828;border-color:#ff5252;font-weight:700">▶️ MOD LIVE</button>
    <label><input type="checkbox" id="demo"> Demo (boți)</label><button data-a="music">🎵 Muzică</button></div>
  <div class="row"><span>tik.tools:</span>
    <input id="ttUser" placeholder="user TikTok (fără @)" style="width:150px"><input id="ttKey" type="password" placeholder="API key" style="width:150px">
    <button data-a="tt">Salvează + conectează</button><span id="st"></span></div>
</div>
</div>
<script>
(()=>{
const Q=new URLSearchParams(location.search),LIVE=Q.has('live');if(LIVE)document.body.classList.add('live');
const W=1080,H=1920,FF='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
const LS={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function font(sz,w=800){ctx.font=`${w} ${sz}px ${FF}`}
function fit(t,max,sz,w=800){font(sz,w);while(ctx.measureText(t).width>max&&sz>12){sz-=2;font(sz,w)}return sz}
function txt(t,x,y,fill,stroke,lw){if(stroke){ctx.lineWidth=lw||6;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(t,x,y)}ctx.fillStyle=fill;ctx.fillText(t,x,y)}
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- Sound ---------- */
let AC=null;function audio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f0,f1,d,type,v,dl=0){if(!AC||AC.state!=='running')return;const t=AC.currentTime+dl,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v,dl=0){if(!AC||AC.state!=='running')return;const t=AC.currentTime+dl,b=AC.createBuffer(1,AC.sampleRate*d|0,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(AC.destination);s.start(t)}
let lastS=0;function sfx(k){if(!AC||Q.get('sfx')==='0')return;const n=performance.now();
  if(k==='join'){if(n-lastS<90)return;lastS=n;tone(600,900,.1,'triangle',.08)}
  else if(k==='chiot'){tone(500,1300,.25,'sawtooth',.05);tone(1300,900,.18,'sawtooth',.04,.22)}
  else if(k==='gift'){[523,659,784].forEach((f,i)=>tone(f,f,.22,'square',.06,i*.07))}
  else if(k==='boom'){tone(120,40,.6,'sine',.5);noise(.6,.25)}
  else if(k==='flip'){tone(300,600,.2,'triangle',.12);tone(600,300,.2,'triangle',.12,.2)}
  else if(k==='bell'){if(n-lastS<200)return;lastS=n;[1568,1976,2349,1976].forEach((f,i)=>tone(f,f*.98,.35,'sine',.05,i*.09))}}
audio();document.addEventListener('pointerdown',audio);setInterval(audio,2000);

/* ---------- Images ---------- */
const imgs=new Map();function img(u){if(!u)return null;let i=imgs.get(u);if(!i){i=new Image();i.referrerPolicy='no-referrer';i.src=u;imgs.set(u,i)}return i.complete&&i.naturalWidth?i:null}

/* ---------- State ---------- */
const users=new Map(),dancers=[];
let tempo=.8,host=null,milestone=0,hi=0,cam=0,mode='sing',modeT=0,visited=0,snowBoost=0,doorMsg=null;
let capra=null,urs=null,plug=null;
const MS=[10,25,50,100,200,500,1000],HS=380;
const houseName=new Map(),spots=[];let photo=null,nextStar=performance.now()+40000;
const banners=[],fws=[],hearts=[],bubbles=[],flakes=[],sparks=[],toss=[],sleighs=[],presents=[];
function U(id,nick){let u=users.get(id);if(!u){u={id,nick:nick||id,pic:'',d:null,chiot:0,gift:0};users.set(id,u)}if(nick)u.nick=nick;return u}
function hash(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function banner(t,s,col,big){if(banners.length>=3){if(!big)return;banners.splice(1,1)}banners.push({t,s,col,big,t0:0})}
const pick=a=>a[(Math.random()*a.length)|0];
function join(u,girl){
  if(u.d){if(girl!=null)u.d.girl=girl;return u.d}
  const d={u,girl:girl!=null?girl:hash(u.id)%2===0,jump:0,star:false,lead:0,nameT:performance.now()+5000,seed:Math.random()*6.28};
  u.d=d;dancers.push(d);sfx('join');
  const n=dancers.length;if(milestone<MS.length&&n>=MS[milestone]){banner(`${MS[milestone]} DE COLINDĂTORI!`,'tot satul a ieșit la colindat 🎄','#ffd54f',true);fireworks(4+milestone*2);sfx('boom');milestone++}
  return d}

/* ---------- Viewer events ---------- */
const SAY=['Hop, hop!','Bună seara!','La mulți ani!','Sărbători fericite!','Am venit cu colindul!','Ho-ho-ho!'];
function onChat(id,nick,text){
  const u=U(id,nick),t=norm(text),now=performance.now();u.act=now;
  let girl=null;if(/\b(fata|fete|fatuca)\b/.test(t))girl=true;else if(/\b(baiat|baieti|flacau)\b/.test(t))girl=false;
  const d=join(u,girl);d.nameT=now+3000;
  if(/hop|chiot|colind|buna seara|la multi ani|craciun|iu+hu+|aho/.test(t)){u.chiot++;d.jump=now;d.nameT=now+3500;bubbles.push({d,t:pick(SAY),t0:now});sfx('chiot')}
  if(/ninge|zapada|fulg/.test(t))snowBoost=Math.min(160,snowBoost+25);
  if(/repede|hai|mergem/.test(t))tempo=Math.min(1.8,tempo+.04);
}
function onLike(id,nick,n){const u=U(id,nick),d=join(u,null);u.act=performance.now();tempo=Math.min(1.8,tempo+.003*n);snowBoost=Math.min(160,snowBoost+n*.6);
  for(let i=0;i<Math.min(6,n);i++)hearts.push({x:d.x||540,y:(d.y||1080)-50,vx:rnd(-40,40),vy:rnd(-160,-90),l:1})}
const GK=[
 {k:'steaua',e:'🌹',l:'Steaua',m:/rose|trandafir/i},
 {k:'capra',e:'🫰',l:'Capra',m:/finger|inimioar/i},
 {k:'ursul',e:'🍩',l:'Ursul',m:/dough|donut|gogoa/i},
 {k:'plug',e:'🫶',l:'Plugușorul',m:/hand ?heart|inimi\b/i},
 {k:'artificii',e:'🎉',l:'Artificii',m:/confetti/i},
 {k:'mos',e:'😎',l:'Moș Crăciun',m:/sunglass|ochelari/i}];
const giftCnt=[0,0,0,0,0,0],giftPic={};try{Object.assign(giftPic,JSON.parse(LS.get('col_gpics')||'{}'))}catch(e){}
function gkind(name,unit){for(let i=0;i<GK.length;i++)if(name&&GK[i].m.test(name))return i;return unit>=199?5:unit>=100?3:unit>=30?2:unit>=5?1:0}
/* gifts are cosmetic only: nothing is counted, ranked or won */
function onGift(id,nick,coins,gname,unit,gpic){
  const u=U(id,nick),d=join(u,null),now=performance.now(),ki=gkind(gname,unit||coins),K=GK[ki];giftCnt[ki]++;d.nameT=now+6000;
  if(gpic&&giftPic[K.k]!==gpic){giftPic[K.k]=gpic;LS.set('col_gpics',JSON.stringify(giftPic))}
  sfx('gift');u.act=now;
  if(['ursul','plug','mos'].includes(K.k))spotlight(u,{ursul:'🐻 a adus Ursul în sat!',plug:'🔔 conduce Plugușorul!',mos:'🎅 l-a adus pe Moș Crăciun!'}[K.k],'#ffd54f');
  if(K.k==='steaua'){d.star=true;sparkle(d.x||540,(d.y||1080)-90,30)}
  else if(K.k==='capra'){capra={u,until:now+45000};bubbles.push({d,t:'Capra a venit!',t0:now})}
  else if(K.k==='ursul'){urs={u,until:now+60000};sfx('boom')}
  else if(K.k==='plug'){plug={u,until:now+60000,next:now};d.lead=now+60000;sfx('bell')}
  else if(K.k==='artificii'){fireworks(10);sfx('boom')}
  else if(K.k==='mos'){host=u;sleighs.push({u,x:W+950,y:rnd(540,600),drop:now});sfx('bell')}
}
function fireworks(n){for(let i=0;i<n;i++)fws.push({x:rnd(150,930),y:rnd(480,700),t0:performance.now()+i*260,col:pick(['#ff5252','#ffd54f','#4fc3f7','#69f0ae','#ff80ab','#ffffff'])})}
function sparkle(x,y,n){for(let i=0;i<n;i++)sparks.push({x,y,vx:rnd(-180,180),vy:rnd(-220,60),l:1})}

/* ---------- Scene ---------- */
const GY=860; /* ground line where houses stand */
const stars=Array.from({length:110},()=>({x:rnd(0,W),y:rnd(370,800),r:rnd(.5,2.4),p:rnd(0,6)}));
const glints=Array.from({length:70},()=>({x:rnd(0,W),y:rnd(870,1500),p:rnd(0,6)}));
const smoke=[];
function houseOf(i){const h=hash('h'+i);return{w:240+h%50,h:160+(h>>3)%45,wall:['#f3ead6','#ecdcc0','#e3ebf2','#f4e4dc','#e9f1e2'][(h>>5)%5],roof:['#8e2f27','#5d4037','#9c3d2e','#46566e'][(h>>7)%4],tree:(h>>9)%3===0,trim:['#2e7d32','#1565c0','#c62828'][(h>>11)%3]}}
function glow(x,y,r,col,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col.replace('A',a));g.addColorStop(1,col.replace('A',0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function drawBg(now){
  const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,'#03061a');g.addColorStop(.45,'#0a1640');g.addColorStop(.8,'#1d2f6b');g.addColorStop(1,'#3a4f8f');ctx.fillStyle=g;ctx.fillRect(0,0,W,GY);
  /* aurora */
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let b=0;b<3;b++){const yb=430+b*45,col=['rgba(80,255,180,A)','rgba(120,160,255,A)','rgba(200,120,255,A)'][b];
    ctx.beginPath();ctx.moveTo(0,yb);for(let x=0;x<=W;x+=30)ctx.lineTo(x,yb+30*Math.sin(x/160+now/2600+b)+14*Math.sin(x/53-now/1700));
    for(let x=W;x>=0;x-=30)ctx.lineTo(x,yb+70+30*Math.sin(x/160+now/2600+b));ctx.closePath();
    const ag=ctx.createLinearGradient(0,yb,0,yb+100);ag.addColorStop(0,col.replace('A',.0));ag.addColorStop(.5,col.replace('A',.10));ag.addColorStop(1,col.replace('A',0));ctx.fillStyle=ag;ctx.fill()}
  ctx.restore();
  for(const s of stars){const a=.35+.45*Math.sin(now/650+s.p);ctx.globalAlpha=a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
    if(s.r>2){ctx.fillRect(s.x-6,s.y-.5,12,1);ctx.fillRect(s.x-.5,s.y-6,1,12)}}ctx.globalAlpha=1;
  glow(880,560,170,'rgba(255,245,210,A)',.35);ctx.fillStyle='#fffbe8';ctx.beginPath();ctx.arc(880,560,42,0,7);ctx.fill();ctx.fillStyle='rgba(200,190,160,.35)';ctx.beginPath();ctx.arc(868,550,9,0,7);ctx.arc(893,572,6,0,7);ctx.fill();
  const p1=cam*.12,p2=cam*.3,p3=cam*.5;
  ctx.fillStyle='#22345f';ctx.beginPath();ctx.moveTo(0,GY);for(let x=0;x<=W;x+=30)ctx.lineTo(x,730+45*Math.sin((x+p1)/190)+22*Math.sin((x+p1)/67));ctx.lineTo(W,GY);ctx.fill();
  ctx.fillStyle='rgba(230,240,255,.55)';ctx.beginPath();for(let x=0;x<=W;x+=30){const y=730+45*Math.sin((x+p1)/190)+22*Math.sin((x+p1)/67);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}for(let x=W;x>=0;x-=30)ctx.lineTo(x,740+45*Math.sin((x+p1)/190)+22*Math.sin((x+p1)/67)+8);ctx.fill();
  /* pine forest */
  ctx.fillStyle='#15254a';for(let k=-2;k<26;k++){const x=((k*52-p2)%1352+1352)%1352-60,hh=40+((k*37)%25),y=790+12*Math.sin(k);ctx.beginPath();ctx.moveTo(x-16,y);ctx.lineTo(x,y-hh);ctx.lineTo(x+16,y);ctx.fill();ctx.fillStyle='rgba(235,242,255,.7)';ctx.beginPath();ctx.moveTo(x-5,y-hh+14);ctx.lineTo(x,y-hh);ctx.lineTo(x+5,y-hh+14);ctx.fill();ctx.fillStyle='#15254a'}
  const cx=((900-p2)%1600+1600)%1600-200;ctx.fillStyle='#1c2b55';ctx.fillRect(cx,740,50,60);ctx.fillRect(cx+15,698,20,44);ctx.beginPath();ctx.moveTo(cx+11,700);ctx.lineTo(cx+25,662);ctx.lineTo(cx+39,700);ctx.fill();glow(cx+25,716,26,'rgba(255,210,100,A)',.6);ctx.fillStyle='#ffd54f';ctx.fillRect(cx+21,710,8,11);
  ctx.fillStyle='#d6e1f2';ctx.beginPath();ctx.moveTo(0,GY+5);for(let x=0;x<=W;x+=30)ctx.lineTo(x,812+16*Math.sin((x+p3)/130+1));ctx.lineTo(W,GY+5);ctx.fill();
  /* snow ground */
  const sg=ctx.createLinearGradient(0,GY,0,H);sg.addColorStop(0,'#eef4fc');sg.addColorStop(.25,'#d3e0f2');sg.addColorStop(.6,'#9fb3d6');sg.addColorStop(1,'#4c5f8c');ctx.fillStyle=sg;ctx.fillRect(0,GY,W,H-GY);
  /* road with tracks */
  ctx.fillStyle='rgba(150,170,210,.35)';ctx.beginPath();ctx.moveTo(0,GY+45);ctx.bezierCurveTo(300,GY+25,780,GY+25,W,GY+45);ctx.lineTo(W,GY+95);ctx.bezierCurveTo(780,GY+75,300,GY+75,0,GY+95);ctx.fill();
  ctx.fillStyle='rgba(110,130,175,.35)';for(let k=0;k<30;k++){const x=((k*44-cam*.9)%1320+1320)%1320-120;ctx.beginPath();ctx.ellipse(x,GY+58+(k%2)*14,7,3.5,0,0,7);ctx.fill()}
  for(const s of glints){const a=Math.max(0,Math.sin(now/500+s.p*3));if(a<.6)continue;ctx.globalAlpha=(a-.6)*2.2;ctx.fillStyle='#fff';ctx.fillRect(s.x-4,s.y-.6,8,1.2);ctx.fillRect(s.x-.6,s.y-4,1.2,8)}ctx.globalAlpha=1;
}
function drawHouses(now){
  const i0=Math.floor((cam-900)/HS),i1=Math.ceil((cam+900)/HS);
  /* warm spill light on snow first */
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=i0;i<=i1;i++){if(i<0||i>hi)continue;const x=540+(i*HS-cam);ctx.save();ctx.translate(x,GY+30);ctx.scale(2.6,.55);glow(0,0,110,'rgba(255,170,70,A)',.32);ctx.restore()}
  ctx.restore();
  for(let i=i0-1;i<=i1;i++){if(i<-1)continue;const lx=540+((i+.5)*HS-cam);if(lx<-60||lx>W+60)continue;
    ctx.fillStyle='#263238';ctx.fillRect(lx-4,GY-150,8,160);ctx.fillRect(lx-14,GY-154,28,8);glow(lx,GY-160,90,'rgba(255,214,120,A)',.45);ctx.fillStyle='#fff3c4';ctx.beginPath();ctx.arc(lx,GY-162,11,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(lx-15,GY-160,30,5);
    ctx.strokeStyle='#6d4c41';ctx.lineWidth=4;for(let f=-1;f<=1;f+=2){const fx=lx+f*60;ctx.beginPath();ctx.moveTo(fx-40,GY-28);ctx.lineTo(fx+40,GY-28);ctx.moveTo(fx-40,GY-14);ctx.lineTo(fx+40,GY-14);ctx.stroke();for(let k=-40;k<=40;k+=20){ctx.fillStyle='#795548';ctx.fillRect(fx+k-3,GY-40,6,40);ctx.fillStyle='#fff';ctx.fillRect(fx+k-4,GY-43,8,5)}}}
  for(let i=i0;i<=i1;i++){if(i<0)continue;const H_=houseOf(i),x=540+(i*HS-cam)-H_.w/2,y=GY,lit=i<=hi,cur=i===hi&&mode==='sing';
    if(x>W+60||x+H_.w<-60)continue;
    ctx.fillStyle='rgba(40,50,90,.18)';ctx.beginPath();ctx.ellipse(x+H_.w/2+20,y+4,H_.w*.62,14,0,0,7);ctx.fill();
    const wg=ctx.createLinearGradient(x,0,x+H_.w,0);wg.addColorStop(0,H_.wall);wg.addColorStop(1,'#b9c3d6');ctx.fillStyle=wg;ctx.fillRect(x,y-H_.h,H_.w,H_.h);
    ctx.fillStyle='rgba(0,0,0,.08)';for(let k=1;k<5;k++)ctx.fillRect(x,y-H_.h+k*H_.h/5,H_.w,2);
    ctx.fillStyle=H_.trim;ctx.fillRect(x,y-18,H_.w,6);
    const rg=ctx.createLinearGradient(0,y-H_.h-85,0,y-H_.h);rg.addColorStop(0,H_.roof);rg.addColorStop(1,'#3a1d16');ctx.fillStyle=rg;ctx.beginPath();ctx.moveTo(x-22,y-H_.h);ctx.lineTo(x+H_.w/2,y-H_.h-85);ctx.lineTo(x+H_.w+22,y-H_.h);ctx.fill();
    ctx.fillStyle='#fbfdff';ctx.beginPath();ctx.moveTo(x-26,y-H_.h+2);ctx.lineTo(x+H_.w/2,y-H_.h-90);ctx.lineTo(x+H_.w+26,y-H_.h+2);for(let k=10;k>=0;k--){const t=k/10;ctx.lineTo(x-26+t*(H_.w+52),y-H_.h+8+5*Math.sin(k*1.7)+(t<.5?-t*2:-(1-t)*2)*80*.22)}ctx.fill();
    ctx.fillStyle='#cfe3ff';for(let k=0;k<9;k++){const ix=x-14+k*(H_.w+28)/8,il=8+((k*7+i)%5)*4;ctx.beginPath();ctx.moveTo(ix-3,y-H_.h+6);ctx.lineTo(ix,y-H_.h+6+il);ctx.lineTo(ix+3,y-H_.h+6);ctx.fill()}
    const chx=x+H_.w*.7;ctx.fillStyle='#6d4c41';ctx.fillRect(chx,y-H_.h-70,22,46);ctx.fillStyle='#fff';ctx.fillRect(chx-4,y-H_.h-76,30,9);
    if(lit&&Math.random()<.08)smoke.push({x:chx+11,c0:cam,y:y-H_.h-80,l:1,r:8});
